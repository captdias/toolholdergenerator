      const DEFAULT_BIT_POCKETS = [

        { kind: 'drill', label: '5 mm', clearanceMm: 0.35 },
        { kind: 'drill', label: '8 mm', clearanceMm: 0.4 },
        { kind: 'driver', label: 'T20', clearanceMm: 0.35 },
        { kind: 'driver', label: 'T15', clearanceMm: 0.35 },
        { kind: 'driver', label: 'T10', clearanceMm: 0.35 },
        { kind: 'driver', label: 'T30', clearanceMm: 0.35 },
      ];

      const EXTRA_BIT_POCKETS = [
        { kind: 'drill', label: '6 mm', clearanceMm: 0.35 },
        { kind: 'driver', label: 'PZ2', clearanceMm: 0.35 },
        { kind: 'drill', label: '1/8"', clearanceMm: 0.35 },
        { kind: 'driver', label: 'H4', clearanceMm: 0.35 },
        { kind: 'driver', label: 'H5', clearanceMm: 0.35 },
        { kind: 'drill', label: '7 mm', clearanceMm: 0.35 },
        { kind: 'driver', label: 'SL5', clearanceMm: 0.35 },
        { kind: 'drill', label: '9 mm', clearanceMm: 0.4 },
        { kind: 'driver', label: 'T40', clearanceMm: 0.35 },
        { kind: 'drill', label: '12 mm', clearanceMm: 0.4 },
      ];

      function parsePocketDiameterMm(label, kind, customDiameterMm) {
        if (customDiameterMm !== undefined && customDiameterMm !== null && customDiameterMm !== '') {
          const parsed = Number(customDiameterMm);
          if (Number.isFinite(parsed) && parsed > 0) {
            return Math.max(1.5, Math.min(22, Number(parsed.toFixed(2))));
          }
        }
        if (kind === 'driver') return 6.35;
        const s = String(label || '').trim().replace(',', '.');
        const fracMatch = s.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
        if (fracMatch) {
          const num = Number(fracMatch[1]);
          const den = Number(fracMatch[2]);
          if (den > 0) {
            return Math.max(1.5, Math.min(22, Number(((num / den) * 25.4).toFixed(2))));
          }
        }
        const numMatch = s.match(/(\d+(?:\.\d+)?)/);
        if (numMatch) {
          const val = Number(numMatch[1]);
          if (Number.isFinite(val) && val > 0) {
            return Math.max(1.5, Math.min(22, Number(val.toFixed(2))));
          }
        }
        return 5.0;
      }

      function normalizeBitRackConfig(config) {
        let pockets = [];
        if (config && Array.isArray(config.pockets) && config.pockets.length > 0) {
          pockets = config.pockets.map((p) => ({
            kind: p.kind === 'drill' ? 'drill' : 'driver',
            label: String(p.label ?? ''),
            clearanceMm: Number.isFinite(Number(p.clearanceMm)) ? Math.max(0, Math.min(2.0, Number(p.clearanceMm))) : 0.35,
            customDiameterMm:
              p.customDiameterMm !== undefined && p.customDiameterMm !== null && p.customDiameterMm !== ''
                ? Number(p.customDiameterMm)
                : null,
          }));
        } else if (config && Array.isArray(config.bits) && config.bits.length > 0) {
          pockets = config.bits.map((lbl) => {
            const text = String(lbl ?? '');
            const isDriver = /^(t|ph|pz|sl|h|sq)\s*\d*/i.test(text.trim());
            return {
              kind: isDriver ? 'driver' : 'drill',
              label: text,
              clearanceMm: 0.35,
              customDiameterMm: null,
            };
          });
        } else {
          pockets = DEFAULT_BIT_POCKETS.map((p) => ({ ...p, customDiameterMm: null }));
        }

        const pocketDepthMm =
          config && Number.isFinite(Number(config.pocketDepthMm))
            ? Math.max(6, Math.min(25, Number(config.pocketDepthMm)))
            : 12;

        return { pockets, pocketDepthMm };
      }

      function computeBitRackGeometry(widthMm, config) {
        const { pockets, pocketDepthMm } = normalizeBitRackConfig(config);
        const count = pockets.length;
        const rows = count > 7 ? 2 : 1;
        const backCount = rows === 2 ? Math.ceil(count / 2) : count;
        const frontCount = rows === 2 ? count - backCount : 0;
        const maxCols = Math.max(1, backCount, frontCount);
        const depthFromBoardMm = rows === 2 ? 37.4 : 23.0;
        const padX = 12;
        const usableW = Math.max(24, widthMm - padX * 2);
        const step = usableW / maxCols;

        const placed = pockets.map((p, idx) => {
          const row = rows === 2 && idx >= backCount ? 1 : 0;
          const col = row === 0 ? idx : idx - backCount;
          const shankDiaMm = parsePocketDiameterMm(p.label, p.kind, p.customDiameterMm);
          const clearanceMm = Number.isFinite(Number(p.clearanceMm)) ? Number(p.clearanceMm) : 0.35;
          const holeDiaMm = Number((shankDiaMm + clearanceMm).toFixed(2));
          const lxCenter = padX + col * step + step / 2;
          const zOffsetFromPlate = rows === 1 ? depthFromBoardMm / 2 : row === 0 ? 10.6 : 26.8;
          return {
            index: idx,
            row,
            col,
            kind: p.kind,
            label: p.label,
            shankDiaMm,
            clearanceMm,
            holeDiaMm,
            lxCenter,
            zOffsetFromPlate,
          };
        });

        return {
          pockets,
          pocketDepthMm,
          rows,
          backCount,
          frontCount,
          maxCols,
          step,
          depthFromBoardMm,
          placed,
        };
      }

      const PLIERS_TEMPLATES = {
        tang: {
          keepProportions: true,
          overallLengthMm: 192.7,
          handleSpreadMm: 69.6,
          jawToShoulderMm: 82.4,
          neckWidthMm: 35.4,
          headWidthMm: 45.7,
          thicknessMm: 17.1,
          centerFromBoardMm: 32.0,
        },
        spisstang: {
          keepProportions: true,
          overallLengthMm: 186.0,
          handleSpreadMm: 58.0,
          jawToShoulderMm: 86.0,
          neckWidthMm: 26.0,
          headWidthMm: 34.0,
          thicknessMm: 14.0,
          centerFromBoardMm: 30.0,
        },
        avbiter: {
          keepProportions: true,
          overallLengthMm: 164.0,
          handleSpreadMm: 64.0,
          jawToShoulderMm: 68.0,
          neckWidthMm: 32.0,
          headWidthMm: 42.0,
          thicknessMm: 16.0,
          centerFromBoardMm: 31.0,
        },
      };

      function isPliersType(type) {
        return type === 'tang' || type === 'spisstang' || type === 'avbiter';
      }

      function normalizePliersConfig(type, config) {
        const tpl = PLIERS_TEMPLATES[type] || PLIERS_TEMPLATES.tang;
        const cfg = config || {};
        const num = (v, fb, lo, hi) => {
          const n = Number(v);
          return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : fb;
        };
        return {
          keepProportions: cfg.keepProportions !== false,
          overallLengthMm: num(cfg.overallLengthMm, tpl.overallLengthMm, 90, 340),
          handleSpreadMm: num(cfg.handleSpreadMm, tpl.handleSpreadMm, 30, 180),
          jawToShoulderMm: num(cfg.jawToShoulderMm, tpl.jawToShoulderMm, 25, 180),
          neckWidthMm: num(cfg.neckWidthMm, tpl.neckWidthMm, 10, 90),
          headWidthMm: num(cfg.headWidthMm, tpl.headWidthMm, 14, 110),
          thicknessMm: num(cfg.thicknessMm, tpl.thicknessMm, 6, 45),
          centerFromBoardMm: num(cfg.centerFromBoardMm, tpl.centerFromBoardMm, 18, 75),
        };
      }

      function computePliersForkMetrics(type, config) {
        const p = normalizePliersConfig(type, config);
        const forkOpeningMm = Number((p.neckWidthMm + 0.7).toFixed(1));
        const headDiff = Math.max(4, p.headWidthMm - p.neckWidthMm);
        const armThicknessMm = Number(Math.max(5.5, Math.min(11, headDiff * 0.72)).toFixed(1));
        const armLenMm = Number(Math.max(24, p.centerFromBoardMm + p.thicknessMm * 0.65 - 4.5).toFixed(1));
        return {
          ...p,
          forkOpeningMm,
          armThicknessMm,
          armLenMm,
        };
      }

      function applyPliersFieldUpdate(type, config, field, nextVal) {
        const cur = normalizePliersConfig(type, config);
        const bounds = {
          overallLengthMm: [90, 340],
          handleSpreadMm: [30, 180],
          jawToShoulderMm: [25, 180],
          neckWidthMm: [10, 90],
          headWidthMm: [14, 110],
          thicknessMm: [6, 45],
          centerFromBoardMm: [18, 75],
        };
        const [lo, hi] = bounds[field] || [5, 400];
        const clamped = Math.max(lo, Math.min(hi, Number(nextVal) || cur[field]));

        if (cur.keepProportions && (field === 'overallLengthMm' || field === 'handleSpreadMm' || field === 'jawToShoulderMm')) {
          const base = cur[field] || 1;
          const ratio = Math.max(0.4, Math.min(2.5, clamped / base));
          const scale = (k, bLo, bHi) => Number(Math.max(bLo, Math.min(bHi, cur[k] * ratio)).toFixed(2));
          return {
            ...(config || {}),
            keepProportions: true,
            overallLengthMm: field === 'overallLengthMm' ? Number(clamped.toFixed(2)) : scale('overallLengthMm', 90, 340),
            handleSpreadMm: field === 'handleSpreadMm' ? Number(clamped.toFixed(2)) : scale('handleSpreadMm', 30, 180),
            jawToShoulderMm: field === 'jawToShoulderMm' ? Number(clamped.toFixed(2)) : scale('jawToShoulderMm', 25, 180),
            neckWidthMm: scale('neckWidthMm', 10, 90),
            headWidthMm: scale('headWidthMm', 14, 110),
            thicknessMm: scale('thicknessMm', 6, 45),
            centerFromBoardMm: cur.centerFromBoardMm,
          };
        }

        return {
          ...(config || {}),
          ...cur,
          [field]: Number(clamped.toFixed(2)),
        };
      }

      function computeItemDimensions(type, config) {
        let widthMm;
        let heightMm;
        if (type === 'fastnokkelholder') {
          const sizes = (config && config.sizes) || [8, 10, 12, 13, 14, 17, 19];
          const count = Math.max(1, sizes.length);
          const maxSize = Math.max(...sizes.map((s) => Number(s) || 10), 10);
          widthMm = Math.max(84, count * 30.5 + 24);
          heightMm = Math.min(340, Math.max(150, 130 + maxSize * 7.2));
        } else if (type === 'bitsholder') {
          const { pockets } = normalizeBitRackConfig(config);
          const count = Math.max(1, pockets.length);
          const rows = count > 7 ? 2 : 1;
          const cols = rows === 2 ? Math.ceil(count / 2) : count;
          const maxHole = Math.max(
            ...pockets.map((p) => parsePocketDiameterMm(p.label, p.kind, p.customDiameterMm) + (p.clearanceMm ?? 0.35)),
            7.0
          );
          const colPitch = Math.max(20.16, maxHole + 8.5);
          widthMm = Math.max(76.2, cols * colPitch + 24);
          heightMm = rows === 2 ? 64.0 : 52.0;
        } else if (isPliersType(type)) {
          const p = normalizePliersConfig(type, config);
          widthMm = Math.max(60, Math.max(p.handleSpreadMm + 16, p.headWidthMm + 28));
          heightMm = Math.max(104, p.overallLengthMm + 14);
        } else if (type === 'skrutrekkerholder') {
          const slots = (config && config.slots) || 5;
          widthMm = slots * 32 + 18;
          heightMm = 210.0;
        } else {
          const cat = TOOL_CATALOG.find((t) => t.id === type);
          widthMm = cat ? cat.defaultWidthMm : 76.2;
          heightMm = cat ? cat.defaultHeightMm : 120;
        }

        if (config && Number.isFinite(Number(config.customWidthMm)) && Number(config.customWidthMm) > 0) {
          widthMm = Math.max(50, Math.min(500, Number(config.customWidthMm)));
        }
        if (config && Number.isFinite(Number(config.customHeightMm)) && Number(config.customHeightMm) > 0) {
          heightMm = Math.max(40, Math.min(450, Number(config.customHeightMm)));
        }

        return {
          widthMm: Number(widthMm.toFixed(2)),
          heightMm: Number(heightMm.toFixed(2)),
        };
      }

      // Felles sannhetskilde for bakplate og skruehull i både 2D og 3D slik at hvert
      // skruehull ligger eksakt på (k + 0.5) * pitch og (m + 0.5) * pitch fra tavlens rutenett.
      function computeHolderLayout(item, pitch, mount) {
        const w = item.widthMm;
        const h = item.heightMm;
        const p = Math.max(10, Number(pitch) || 25.4);
        const holeDia = Math.max(3, Number(mount?.holeDiaMm) || 5.2);
        const holeR = holeDia / 2;
        const edgeMargin = Math.max(4.8, holeR + 2.2);

        const plateX = item.type === 'klohammer' ? 4 : 1;
        const plateW = Math.max(24, w - plateX * 2);
        const plateY = 0;

        const m0 = Math.max(0, Math.ceil((plateY + edgeMargin) / p - 0.5 - 1e-6));
        const ly0 = Number(((m0 + 0.5) * p).toFixed(4));
        const ly1 = Number(((m0 + 1.5) * p).toFixed(4));
        const wantDoubleRow = mount?.styleId === 'screw_double' && item.type !== 'bitsholder';

        let plateH;
        if (item.type === 'bitsholder') {
          plateH = h;
        } else if (item.type === 'maleband') {
          plateH = Math.min(h - 4, Math.max(64, wantDoubleRow ? ly1 + 12 : 64));
        } else if (item.type === 'klohammer') {
          plateH = Math.min(h, Math.max(68, wantDoubleRow ? ly1 + 12 : 68));
        } else {
          plateH = Math.min(h, Math.max(50, (wantDoubleRow ? ly1 + 10 : ly0 + 34)));
        }

        const minX = plateX + edgeMargin;
        const maxX = plateX + plateW - edgeMargin;
        const kStart = Math.max(0, Math.ceil(minX / p - 0.5 - 1e-6));
        const kEnd = Math.floor(maxX / p - 0.5 + 1e-6);
        const validKs = [];
        for (let k = kStart; k <= kEnd; k++) {
          validKs.push(k);
        }
        if (validKs.length === 0) {
          validKs.push(Math.max(0, Math.round((plateX + plateW / 2) / p - 0.5)));
        }

        const kMin = validKs[0];
        const kMax = validKs[validKs.length - 1];
        const topKs = [kMin];
        if (validKs.length >= 5) {
          topKs.push(validKs[Math.floor((validKs.length - 1) / 2)]);
        }
        if (kMax !== kMin) {
          topKs.push(kMax);
        }

        const holes = topKs.map((k) => ({
          k,
          m: m0,
          lx: Number(((k + 0.5) * p).toFixed(4)),
          ly: ly0,
        }));

        const hasDoubleRow = wantDoubleRow && ly1 <= plateY + plateH - edgeMargin + 1e-6;
        if (hasDoubleRow) {
          const botKs = kMax !== kMin ? [kMin, kMax] : [kMin];
          botKs.forEach((k) => {
            holes.push({
              k,
              m: m0 + 1,
              lx: Number(((k + 0.5) * p).toFixed(4)),
              ly: ly1,
            });
          });
        }

        return {
          plateX,
          plateY,
          plateW,
          plateH,
          ly0,
          ly1,
          hasDoubleRow,
          holes,
        };
      }

      function getRotatedLocalPoint(lx, ly, w, h, rotation) {
        const rot = ((rotation % 360) + 360) % 360;
        const dx = lx - w / 2;
        const dy = ly - h / 2;
        if (rot === 90) return { rx: w / 2 - dy, ry: h / 2 + dx };
        if (rot === 180) return { rx: w / 2 - dx, ry: h / 2 - dy };
        if (rot === 270) return { rx: w / 2 + dy, ry: h / 2 - dx };
        return { rx: lx, ry: ly };
      }

      function snapItemPosition(valX, valY, item, board, mount, snapToGrid) {
        const w = item.widthMm;
        const h = item.heightMm;
        const rot = ((item.rotation % 360) + 360) % 360;
        const swapped = rot === 90 || rot === 270;
        const boardW = board.cols * board.pitch;
        const boardH = board.rows * board.pitch;
        const minX = swapped ? (h - w) / 2 : 0;
        const maxX = boardW - (swapped ? (w + h) / 2 : w);
        const minY = swapped ? (w - h) / 2 : 0;
        const maxY = boardH - (swapped ? (w + h) / 2 : h);

        const clampAxis = (v, lo, hi) => (hi >= lo ? Math.max(lo, Math.min(hi, v)) : (lo + hi) / 2);

        if (!snapToGrid) {
          return {
            xMm: Number(clampAxis(valX, minX, maxX).toFixed(1)),
            yMm: Number(clampAxis(valY, minY, maxY).toFixed(1)),
          };
        }

        const layout = computeHolderLayout(item, board.pitch, mount);
        const refHole = layout.holes[0];
        const { rx, ry } = getRotatedLocalPoint(refHole.lx, refHole.ly, w, h, rot);
        const p = board.pitch;

        const snapAxis = (val, rOffset, lo, hi, count) => {
          let col = Math.round((val + rOffset) / p - 0.5);
          col = Math.max(0, Math.min(count - 1, col));
          let snapped = (col + 0.5) * p - rOffset;
          if (hi >= lo) {
            if (snapped < lo - 1e-4) {
              col = Math.min(count - 1, Math.ceil((lo + rOffset) / p - 0.5 - 1e-6));
              snapped = (col + 0.5) * p - rOffset;
            } else if (snapped > hi + 1e-4) {
              col = Math.max(0, Math.floor((hi + rOffset) / p - 0.5 + 1e-6));
              snapped = (col + 0.5) * p - rOffset;
            }
          }
          return Number(snapped.toFixed(4));
        };

        return {
          xMm: snapAxis(valX, rx, minX, maxX, board.cols),
          yMm: snapAxis(valY, ry, minY, maxY, board.rows),
        };
      }

          const railTop = Math.max(20, layout.ly0 + 7);

          return (

                    fill={gripColor}

        if (item.type === 'klohammer') {
          const cx = w / 2;

              {renderScrewHoles()}
              {Array.from({ length: slots }).map((_, i) => {

                    {showTool && (
                      <g>
                        <rect x={sx - 7.5} y={barTop - 16} width={15} height={44} rx={5} fill="#2563eb" stroke="#60a5fa" strokeWidth={0.8} />
                        <rect x={sx - 2.2} y={barTop + 28} width={4.4} height={bladeLen} rx={1} fill={metalFill} stroke="#475569" strokeWidth={0.7} />
                      </g>
                    )}
                  </g>
                );
              })}
            </g>
          );
        }

        // Målebånd
        const clipY = Math.max(24, layout.ly0 + 11);
        const tapeH = Math.max(20, h - clipY - 12);
        return (
          <g>
            <rect x={layout.plateX} y={layout.plateY} width={layout.plateW} height={layout.plateH} rx={6} fill={holderFill} stroke={holderStroke} strokeWidth={1.1} />
            <rect x={w / 2 - 14} y={clipY} width={28} height={10} rx={2} fill="#152436" stroke="#93c5fd" strokeWidth={0.9} />
            {renderScrewHoles()}
            {showTool && (
              <g>
                <rect x={10} y={clipY - 4} width={w - 20} height={tapeH} rx={14} fill="#eab308" stroke="#a16207" strokeWidth={1.2} />
                <rect x={18} y={clipY + 6} width={w - 36} height={Math.max(10, tapeH - 20)} rx={8} fill="#1e293b" />
                <circle cx={w / 2} cy={clipY + tapeH / 2 - 2} r={Math.min(10, tapeH * 0.25)} fill="#334155" stroke="#64748b" strokeWidth={1} />
              </g>
            )}
          </g>
        );
      }

      // ============================================================================
      // 4. 3D-VISNING (Three.js + OrbitControls + STLExporter)
      // ============================================================================

      // Felles 3D-bygger for alle parametriske holdere (uten tavle-bakplaten)
      // Brukes både av ThreeDInspectionView og binær STL-eksport (verktoyholdere.stl).
      function buildHolders3D(THREE, items, board, mount, options = {}) {
        const {
          selectedId = null,
          isolateSelected = false,
          showTools = false,
          targetPrintableGroup = null,
          targetToolsGroup = null,
        } = options;

        const boardW = board.cols * board.pitch;
        const boardH = board.rows * board.pitch;
        const printableRoot = targetPrintableGroup || new THREE.Group();
        const toolsRoot = targetToolsGroup || new THREE.Group();

        const holderMat = new THREE.MeshStandardMaterial({ color: '#3b82f6', roughness: 0.36, metalness: 0.14 });
        const holderSelectedMat = new THREE.MeshStandardMaterial({ color: '#93c5fd', roughness: 0.3, metalness: 0.2 });
        const steelMat = new THREE.MeshStandardMaterial({ color: '#d1dae6', roughness: 0.24, metalness: 0.88 });
        const gripMat = new THREE.MeshStandardMaterial({ color: '#1d4ed8', roughness: 0.68, metalness: 0.06 });
        const darkRubberMat = new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.78, metalness: 0.08 });
        const woodMat = new THREE.MeshStandardMaterial({ color: '#c88c52', roughness: 0.64, metalness: 0.04 });

        const createBackplateWithScrewHoles = (plateW, plateH, plateThick, screwPositions, holeDia) => {
          const hw = plateW / 2;
          const hh = plateH / 2;
          const r = Math.min(3.5, hw * 0.2, hh * 0.2);

          const shape = new THREE.Shape();
          shape.moveTo(-hw + r, -hh);
          shape.lineTo(hw - r, -hh);
          shape.quadraticCurveTo(hw, -hh, hw, -hh + r);
          shape.lineTo(hw, hh - r);
          shape.quadraticCurveTo(hw, hh, hw - r, hh);
          shape.lineTo(-hw + r, hh);
          shape.quadraticCurveTo(-hw, hh, -hw, hh - r);
          shape.lineTo(-hw, -hh + r);
          shape.quadraticCurveTo(-hw, -hh, -hw + r, -hh);

          const holeR = Math.max(1.5, holeDia / 2);
          screwPositions.forEach(([sx, sy]) => {
            const holePath = new THREE.Path();
            holePath.absarc(sx, sy, holeR, 0, Math.PI * 2, true);
            shape.holes.push(holePath);
          });

          return new THREE.ExtrudeGeometry(shape, {
            depth: plateThick,
            bevelEnabled: false,
            curveSegments: 18,
          });
        };

        const visibleItems = isolateSelected && selectedId ? items.filter((it) => it.id === selectedId) : items;
        const screwHoleDia = mount?.holeDiaMm || 5.2;
        const screwDia = mount?.screwDiaMm || 5.0;
        const screwLen = mount?.screwLenMm || 6.5;

        visibleItems.forEach((item) => {
          const itemGroup = new THREE.Group();
          const holderMeshGroup = new THREE.Group();
          const toolMeshGroup = new THREE.Group();
          const mat = item.id === selectedId ? holderSelectedMat : holderMat;

          const w = item.widthMm;
          const h = item.heightMm;
          const cx = isolateSelected ? 0 : -boardW / 2 + item.xMm + w / 2;
          const cy = isolateSelected ? 0 : boardH / 2 - item.yMm - h / 2;
          itemGroup.position.set(cx, cy, 0);
          itemGroup.rotation.z = -(item.rotation * Math.PI) / 180;

          const layout = computeHolderLayout(item, board.pitch, mount);
          const plateW = layout.plateW;
          const plateH = layout.plateH;
          const plateThick = 4.5;
          const plateCenterX = layout.plateX + plateW / 2 - w / 2;
          const plateCenterY = h / 2 - (layout.plateY + plateH / 2);

          const screwPositions = layout.holes.map((hole) => [
            (hole.lx - w / 2) - plateCenterX,
            (h / 2 - hole.ly) - plateCenterY,
          ]);

          const backplateGeo = createBackplateWithScrewHoles(plateW, plateH, plateThick, screwPositions, screwHoleDia);
          const backplate = new THREE.Mesh(backplateGeo, mat);
          backplate.position.set(plateCenterX, plateCenterY, 0);
          backplate.castShadow = true;
          holderMeshGroup.add(backplate);

          screwPositions.forEach(([sx, sy]) => {
            const hx = plateCenterX + sx;
            const hy = plateCenterY + sy;
            if (mount?.styleId === 'screw_csk') {
              const cskRing = new THREE.Mesh(
                new THREE.RingGeometry(screwHoleDia / 2, screwHoleDia / 2 + 1.8, 18),
                mat
              );
              cskRing.position.set(hx, hy, plateThick + 0.05);
              holderMeshGroup.add(cskRing);
            }
            if (showTools) {
              const screwHead = new THREE.Mesh(
                new THREE.CylinderGeometry(screwDia / 2 + 1.4, screwDia / 2 + 1.4, 1.8, 16),
                steelMat
              );
              screwHead.rotation.x = Math.PI / 2;
              screwHead.position.set(hx, hy, plateThick + 0.9);
              toolMeshGroup.add(screwHead);

              const screwShaft = new THREE.Mesh(
                new THREE.CylinderGeometry(screwDia / 2, screwDia / 2 - 0.5, screwLen, 14),
                steelMat
              );
              screwShaft.rotation.x = Math.PI / 2;
              screwShaft.position.set(hx, hy, plateThick - screwLen / 2);
              toolMeshGroup.add(screwShaft);
            }
          });

          if (item.type === 'fastnokkelholder') {
            const sizes = (item.config && item.config.sizes) || [8, 10, 12, 13, 14, 17, 19];
            const count = sizes.length;
            const padX = 24;
            const usableW = Math.max(36, w - padX * 2);
            const step = count > 1 ? usableW / (count - 1) : 0;
            const railTopLy = Math.max(20, layout.ly0 + 7);
            const combBottomY = h / 2 - (railTopLy + 22);

            const combProfile = new THREE.Shape();
            combProfile.moveTo(0, 0);
            combProfile.lineTo(42, 12);
            combProfile.lineTo(42, 20);
            combProfile.lineTo(0, 10);
            combProfile.closePath();

            const combBaseGeo = new THREE.ExtrudeGeometry(combProfile, {
              depth: plateW,
              bevelEnabled: true,
              bevelThickness: 0.8,
              bevelSize: 0.8,
              bevelSegments: 2,
            });
            combBaseGeo.rotateY(Math.PI / 2);
            combBaseGeo.translate(plateCenterX - plateW / 2, combBottomY, 4.5);
            const combBase = new THREE.Mesh(combBaseGeo, mat);
            combBase.castShadow = true;
            holderMeshGroup.add(combBase);

            const finProfile = new THREE.Shape();
            finProfile.moveTo(0, 0);
            finProfile.lineTo(38, 12);
            finProfile.lineTo(38, 22);
            finProfile.lineTo(33, 22);
            finProfile.lineTo(0, 11);
            finProfile.closePath();

            const finDepth = 5.5;
            const finGeo = new THREE.ExtrudeGeometry(finProfile, {
              depth: finDepth,
              bevelEnabled: true,
              bevelThickness: 0.5,
              bevelSize: 0.5,
              bevelSegments: 1,
            });
            finGeo.rotateY(Math.PI / 2);

            for (let i = 0; i <= count; i++) {
              const fx =
                count === 1
                  ? i === 0
                    ? -14
                    : 14
                  : -usableW / 2 - step * 0.48 + i * step;
              const fin = new THREE.Mesh(finGeo, mat);
              fin.position.set(fx - finDepth / 2, combBottomY + 7, 5);
              fin.castShadow = true;
              holderMeshGroup.add(fin);
            }

            if (showTools) {
              sizes.forEach((sz, i) => {
                const wx = count === 1 ? 0 : -usableW / 2 + i * step;
                const num = Number(sz) || 10;
                const len = Math.max(32, Math.min(h - railTopLy - 24, 95 + num * 6.5));
                const shaftW = 4.2 + Math.min(5, num * 0.25);
                const headY = h / 2 - (railTopLy + 10);

                const shaft = new THREE.Mesh(new THREE.BoxGeometry(shaftW, len, 4.2), steelMat);
                shaft.position.set(wx, headY - len / 2, 26);
                shaft.castShadow = true;
                toolMeshGroup.add(shaft);

                const headTop = new THREE.Mesh(new THREE.CylinderGeometry(shaftW * 1.15, shaftW * 1.15, 4.8, 16), steelMat);
                headTop.rotation.x = Math.PI / 2;
                headTop.position.set(wx, headY, 26);
                toolMeshGroup.add(headTop);

                const headBot = new THREE.Mesh(new THREE.TorusGeometry(shaftW * 0.85, 2.0, 10, 18), steelMat);
                headBot.position.set(wx, headY - len, 26);
                toolMeshGroup.add(headBot);
              });
            }
          } else if (item.type === 'bitsholder') {
            // Blokk med 1 eller 2 rader med fysiske borhull (sirkel) og bitshull (sekskant) + bunnplate
            const rack = computeBitRackGeometry(w, item.config);
            const blockW = plateW;
            const blockTopLy = Math.max(22, layout.ly0 + 9);
            const maxBlockH = Math.max(16, h - blockTopLy - 4);
            const floorH = 3.5;
            const pocketDepth = Math.min(maxBlockH + 8, rack.pocketDepthMm || 12);
            const blockD = rack.depthFromBoardMm;
            const blockCenterY = h / 2 - (blockTopLy + (floorH + pocketDepth) / 2);

            // Solid bunnplate under hullene slik at bor og bits ikke faller rett gjennom
            const floorGeo = new THREE.BoxGeometry(blockW, floorH, blockD);
            const floorMesh = new THREE.Mesh(floorGeo, mat);
            floorMesh.position.set(plateCenterX, blockCenterY - pocketDepth / 2, 4.5 + blockD / 2);
            floorMesh.castShadow = true;
            holderMeshGroup.add(floorMesh);

            // Øvre del av blokken ekstrudert med fysiske sirkel- og sekskanthull
            const blockShape = new THREE.Shape();
            blockShape.moveTo(-blockW / 2, 0);
            blockShape.lineTo(blockW / 2, 0);
            blockShape.lineTo(blockW / 2, blockD);
            blockShape.lineTo(-blockW / 2, blockD);
            blockShape.closePath();

            rack.placed.forEach((p) => {
              const bx = (-w / 2 + p.lxCenter) - plateCenterX;
              const cz = p.zOffsetFromPlate;
              if (Math.abs(bx) < blockW / 2 - 3.5) {
                if (p.kind === 'drill') {
                  const rad = Math.max(1.0, Math.min(rack.step * 0.42, p.holeDiaMm / 2));
                  const circle = new THREE.Path();
                  circle.absarc(bx, cz, rad, 0, Math.PI * 2, true);
                  blockShape.holes.push(circle);
                } else {
                  const hex = new THREE.Path();
                  const flatToFlat = p.holeDiaMm;
                  const hr = Math.max(2.6, flatToFlat / Math.sqrt(3));
                  for (let k = 0; k < 6; k++) {
                    const a = (k * Math.PI) / 3;
                    const px = bx + Math.cos(a) * hr;
                    const py = cz + Math.sin(a) * hr;
                    if (k === 0) hex.moveTo(px, py);
                    else hex.lineTo(px, py);
                  }
                  hex.closePath();
                  blockShape.holes.push(hex);
                }
              }
            });

            const blockGeo = new THREE.ExtrudeGeometry(blockShape, {
              depth: pocketDepth,
              bevelEnabled: false,
              curveSegments: 18,
            });
            blockGeo.rotateX(Math.PI / 2);
            const block = new THREE.Mesh(blockGeo, mat);
            block.position.set(plateCenterX, blockCenterY + pocketDepth / 2 + floorH / 2, 4.5);
            block.castShadow = true;
            holderMeshGroup.add(block);

            [-blockW / 2 + 3, blockW / 2 - 3].forEach((gx) => {
              const gusset = new THREE.Mesh(new THREE.BoxGeometry(4, Math.min(18, pocketDepth + 4), Math.max(18, blockD - 6)), mat);
              gusset.position.set(plateCenterX + gx, blockCenterY + pocketDepth / 2 + 3, 4.5 + blockD * 0.42);
              holderMeshGroup.add(gusset);
            });

            if (showTools) {
              const topSurfaceY = blockCenterY + pocketDepth / 2 + floorH / 2;
              rack.placed.forEach((p) => {
                const bx = -w / 2 + p.lxCenter;
                const bz = 4.5 + p.zOffsetFromPlate;
                if (p.kind === 'drill') {
                  const r = Math.max(0.9, p.shankDiaMm / 2);
                  const protrude = Math.min(72, 26 + p.shankDiaMm * 4.2);
                  const totalLen = pocketDepth + protrude;
                  const drill = new THREE.Mesh(new THREE.CylinderGeometry(r, r, totalLen, 16), steelMat);
                  drill.position.set(bx, topSurfaceY - pocketDepth + totalLen / 2, bz);
                  drill.castShadow = true;
                  toolMeshGroup.add(drill);

                  const tip = new THREE.Mesh(new THREE.ConeGeometry(r, Math.max(3, r * 1.8), 16), steelMat);
                  tip.position.set(bx, topSurfaceY + protrude + Math.max(1.5, r * 0.9), bz);
                  toolMeshGroup.add(tip);
                } else {
                  const bitLen = pocketDepth + 16;
                  const bit = new THREE.Mesh(new THREE.CylinderGeometry(3.15, 3.15, bitLen, 6), steelMat);
                  bit.position.set(bx, topSurfaceY - pocketDepth + bitLen / 2, bz);
                  bit.castShadow = true;
                  toolMeshGroup.add(bit);

                  const tip = new THREE.Mesh(new THREE.ConeGeometry(2.4, 5.5, 6), steelMat);
                  tip.position.set(bx, topSurfaceY + 18.7, bz);
                  toolMeshGroup.add(tip);
                }
              });
            }
          } else if (item.type === 'klohammer') {
            const forkOffsetX = 20;
            const forkLen = 48;
            const forkLy = Math.max(44, layout.ly0 + 28);
            const forkY = h / 2 - forkLy;

            [-forkOffsetX, forkOffsetX].forEach((fx) => {
              const pin = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 5.2, forkLen, 14), mat);
              pin.rotation.x = Math.PI / 2;
              pin.position.set(fx, forkY, forkLen / 2 + 4);
              pin.castShadow = true;
              holderMeshGroup.add(pin);

              const lip = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.5, 11, 12), mat);
              lip.position.set(fx, forkY + 4.5, forkLen + 2);
              holderMeshGroup.add(lip);

              const rib = new THREE.Mesh(new THREE.BoxGeometry(6, 16, 18), mat);
              rib.position.set(fx, forkY - 8, 13);
              holderMeshGroup.add(rib);
            });

            if (showTools) {
              const shaftLen = Math.max(30, h - 72);
              const head = new THREE.Mesh(new THREE.BoxGeometry(108, 22, 22), steelMat);
              head.position.set(0, forkY + 14, 28);
              head.castShadow = true;
              toolMeshGroup.add(head);

              const face = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 12, 16), steelMat);
              face.rotation.z = Math.PI / 2;
              face.position.set(-56, forkY + 14, 28);
              toolMeshGroup.add(face);

              const shaft = new THREE.Mesh(new THREE.CylinderGeometry(8.5, 10, shaftLen, 14), woodMat);
              shaft.position.set(0, forkY - shaftLen / 2 + 6, 28);
              shaft.castShadow = true;
              toolMeshGroup.add(shaft);

              const gripLen = Math.min(95, Math.max(18, shaftLen * 0.42));
              const rubberGrip = new THREE.Mesh(new THREE.CylinderGeometry(10.5, 11, gripLen, 14), darkRubberMat);
              rubberGrip.position.set(0, forkY - shaftLen + gripLen / 2 + 6, 28);
              toolMeshGroup.add(rubberGrip);
            }
          } else if (item.type === 'tang' || item.type === 'spisstang' || item.type === 'avbiter') {
            const pf = computePliersForkMetrics(item.type, item.config);
            const armOffsetX = pf.forkOpeningMm / 2 + pf.armThicknessMm / 2;
            const armLen = pf.armLenMm;
            const pinLy = Math.max(layout.ly0 + 18, Math.min(h - 32, 7 + pf.jawToShoulderMm));
            const pinY = h / 2 - pinLy;
            const armHeight = 8.5;

            [-armOffsetX, armOffsetX].forEach((px) => {
              const arm = new THREE.Mesh(new THREE.BoxGeometry(pf.armThicknessMm, armHeight, armLen), mat);
              arm.position.set(px, pinY, 4.5 + armLen / 2);
              arm.castShadow = true;
              holderMeshGroup.add(arm);

              const frontLip = new THREE.Mesh(new THREE.CylinderGeometry(pf.armThicknessMm * 0.48, pf.armThicknessMm * 0.48, 5.5, 12), mat);
              frontLip.position.set(px, pinY + armHeight / 2 + 2.2, 4.5 + armLen - pf.armThicknessMm * 0.48);
              holderMeshGroup.add(frontLip);

              const gusset = new THREE.Mesh(new THREE.BoxGeometry(pf.armThicknessMm, 14, 12), mat);
              gusset.position.set(px, pinY - 7, 10);
              holderMeshGroup.add(gusset);
            });

            if (showTools) {
              const toolZ = Math.max(16, pf.centerFromBoardMm);
              const jawLen = Math.max(22, pf.jawToShoulderMm - 10);
              const jawW = item.type === 'spisstang' ? Math.min(10, pf.headWidthMm * 0.35) : Math.min(34, pf.headWidthMm * 0.65);
              const toolThick = Math.max(6, Math.min(26, pf.thicknessMm * 0.65));
              const jaw = new THREE.Mesh(new THREE.BoxGeometry(jawW, jawLen, toolThick), steelMat);
              jaw.position.set(0, pinY + jawLen / 2 + 6, toolZ);
              jaw.castShadow = true;
              toolMeshGroup.add(jaw);

              const pivotR = Math.max(6, Math.min(18, pf.headWidthMm * 0.32));
              const pivot = new THREE.Mesh(new THREE.CylinderGeometry(pivotR, pivotR, toolThick + 2, 18), steelMat);
              pivot.rotation.x = Math.PI / 2;
              pivot.position.set(0, pinY + 7, toolZ);
              toolMeshGroup.add(pivot);

              const handleLen = Math.max(36, pf.overallLengthMm - pf.jawToShoulderMm);
              const handleOffset = Math.max(10, pf.handleSpreadMm * 0.34);
              const pliersGripMat = item.type === 'tang' ? new THREE.MeshStandardMaterial({ color: '#ea580c', roughness: 0.65, metalness: 0.08 }) : gripMat;
              [-1, 1].forEach((side) => {
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(4.4, 5.6, handleLen, 14), pliersGripMat);
                handle.position.set(side * handleOffset, pinY - handleLen / 2, toolZ);
                handle.rotation.z = side * Math.atan2(handleOffset * 0.55, handleLen);
                handle.castShadow = true;
                toolMeshGroup.add(handle);
              });
            }
          } else if (item.type === 'skrutrekkerholder') {
            // Skrutrekkerhylle ekstrudert med fysiske gjennomgående hull
            const slots = (item.config && item.config.slots) || 5;
            const barD = 34;
            const barH = 12;
            const barTopLy = Math.max(24, layout.ly0 + 10);
            const barY = h / 2 - (barTopLy + barH / 2);
            const padX = 24;
            const step = (w - padX * 2) / slots;

            const barShape = new THREE.Shape();
            barShape.moveTo(-plateW / 2, 0);
            barShape.lineTo(plateW / 2, 0);
            barShape.lineTo(plateW / 2, barD);
            barShape.lineTo(-plateW / 2, barD);
            barShape.closePath();

            for (let i = 0; i < slots; i++) {
              const sx = (-w / 2 + padX + i * step + step / 2) - plateCenterX;
              if (Math.abs(sx) < plateW / 2 - 7) {
                const holePath = new THREE.Path();
                holePath.absarc(sx, barD / 2 + 2, 6, 0, Math.PI * 2, true);
                barShape.holes.push(holePath);
              }
            }

            const barGeo = new THREE.ExtrudeGeometry(barShape, {
              depth: barH,
              bevelEnabled: false,
              curveSegments: 16,
            });
            barGeo.rotateX(Math.PI / 2);
            const bar = new THREE.Mesh(barGeo, mat);
            bar.position.set(plateCenterX, barY + barH / 2, 4.5);
            bar.castShadow = true;
            holderMeshGroup.add(bar);

            if (showTools) {
              for (let i = 0; i < slots; i++) {
                const sx = -w / 2 + padX + i * step + step / 2;
                const handle = new THREE.Mesh(new THREE.CylinderGeometry(7.5, 6.5, 48, 12), gripMat);
                handle.position.set(sx, barY + 28, barD / 2 + 6.5);
                toolMeshGroup.add(handle);

                const bladeLen = Math.max(20, Math.min(h - barTopLy - 28, 95 + (i % 3) * 24));
                const blade = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, bladeLen, 10), steelMat);
                blade.position.set(sx, barY - 4 - bladeLen / 2, barD / 2 + 6.5);
                toolMeshGroup.add(blade);
              }
            }
          } else {
            const clipLy = Math.max(26, layout.ly0 + 13);
            const clipY = h / 2 - clipLy;
            const shelfY = h / 2 - (layout.plateY + plateH - 7);
            const shelf = new THREE.Mesh(new THREE.BoxGeometry(Math.max(16, plateW - 8), 10, 32), mat);
            shelf.position.set(plateCenterX, shelfY, 18);
            holderMeshGroup.add(shelf);
            const clipBar = new THREE.Mesh(new THREE.BoxGeometry(Math.min(28, plateW - 4), 12, 6), mat);
            clipBar.position.set(plateCenterX, clipY, 14);
            holderMeshGroup.add(clipBar);

            if (showTools) {
              const tapeMat = new THREE.MeshStandardMaterial({ color: '#eab308', roughness: 0.45, metalness: 0.1 });
              const body = new THREE.Mesh(new THREE.BoxGeometry(Math.max(16, plateW - 14), Math.max(16, h - clipLy - 14), 26), tapeMat);
              body.position.set(plateCenterX, (clipY + shelfY) / 2 + 2, 24);
              toolMeshGroup.add(body);
            }
          }

          itemGroup.add(holderMeshGroup);
          printableRoot.add(itemGroup);

          if (showTools) {
            toolMeshGroup.position.copy(itemGroup.position);
            toolMeshGroup.rotation.copy(itemGroup.rotation);
            toolsRoot.add(toolMeshGroup);
          }
        });

        const dispose = () => {
          [printableRoot, toolsRoot].forEach((grp) => {
            grp.traverse((obj) => {
              if (obj.geometry) obj.geometry.dispose();
              if (obj.material) {
                if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
                else obj.material.dispose();
              }
            });
          });
        };

        return { printableRoot, toolsRoot, dispose };
      }

      // Eksporterer alle holdere på tavlen (uten selve tavle-bakplaten) til en binær .stl-fil
      function exportHoldersToBinarySTL(items, board, mount, options = {}) {
        const { filename = 'verktoyholdere.stl', selectedId = null, isolateSelected = false } = options;
        if (!window.THREE_KIT) {
          return { ok: false, message: 'Laster 3D-eksportmotor, prøv igjen om et øyeblikk.' };
        }
        if (!items || items.length === 0) {
          return { ok: false, message: 'Legg til minst én holder på tavlen før du laster ned STL.' };
        }

        const { THREE, STLExporter } = window.THREE_KIT;
        const { printableRoot, dispose } = buildHolders3D(THREE, items, board, mount, {
          selectedId,
          isolateSelected,
          showTools: false,
        });

        printableRoot.updateMatrixWorld(true);
        const exporter = new STLExporter();
        const binaryStl = exporter.parse(printableRoot, { binary: true });
        const blob = new Blob([binaryStl], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        dispose();

        return {
          ok: true,
          count: isolateSelected && selectedId ? 1 : items.length,
          message: 'STL-fil lastet ned!',
        };
      }

      function ThreeDInspectionView({ board, mount, items, selectedId, onNotifyStl }) {
        const mountRef = useRef(null);
        const [threeReady, setThreeReady] = useState(Boolean(window.THREE_KIT));
        const [isolateSelected, setIsolateSelected] = useState(false);
        const [showTools3D, setShowTools3D] = useState(true);
        const [exportStatus, setExportStatus] = useState('');
        const sceneGroupRef = useRef(null);
        const printableGroupRef = useRef(null);
        const cameraRef = useRef(null);
        const controlsRef = useRef(null);

        useEffect(() => {
          if (window.THREE_KIT) {
            setThreeReady(true);
            return;
          }
          const handler = () => setThreeReady(true);
          window.addEventListener('three-kit-ready', handler);
          return () => window.removeEventListener('three-kit-ready', handler);
        }, []);

        useEffect(() => {
          if (!threeReady || !mountRef.current) return;
          const { THREE, OrbitControls, RoomEnvironment } = window.THREE_KIT;
          const container = mountRef.current;

          const isSoftwareGl = (() => {
            try {
              const c = document.createElement('canvas');
              const gl = c.getContext('webgl2') || c.getContext('webgl');
              if (!gl) return true;
              const ext = gl.getExtension('WEBGL_debug_renderer_info');
              const gpu = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : String(gl.getParameter(gl.RENDERER));
              gl.getExtension('WEBGL_lose_context')?.loseContext();
              return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
            } catch {
              return true;
            }
          })();

          const renderer = new THREE.WebGLRenderer({ antialias: !isSoftwareGl, powerPreference: 'high-performance' });
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.08;
          renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio, 2));
          renderer.shadowMap.enabled = !isSoftwareGl;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.setSize(container.clientWidth, container.clientHeight);
          container.appendChild(renderer.domElement);

          const scene = new THREE.Scene();
          scene.background = new THREE.Color('#0f1c2e');
          scene.fog = new THREE.Fog('#0f1c2e', 1600, 3800);

          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
          pmrem.dispose();

          const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 1, 6000);
          camera.position.set(240, -180, 920);
          cameraRef.current = camera;

          const controls = new OrbitControls(camera, renderer.domElement);
          controls.enableDamping = !isSoftwareGl;
          controls.dampingFactor = 0.07;
          controls.enableRotate = true;
          controls.enableZoom = true;
          controls.enablePan = true;
          controls.minDistance = 80;
          controls.maxDistance = 2600;
          controlsRef.current = controls;

          // Belysning: AmbientLight + HemisphereLight + DirectionalLight (hovedlys og baklys)
          const ambientLight = new THREE.AmbientLight('#dbeafe', 0.45);
          scene.add(ambientLight);

          const hemiLight = new THREE.HemisphereLight('#c7dfff', '#162436', 0.65);
          scene.add(hemiLight);

          const keyLight = new THREE.DirectionalLight('#fff6eb', 1.75);
          keyLight.position.set(480, 560, 740);
          keyLight.castShadow = !isSoftwareGl;
          keyLight.shadow.mapSize.set(1024, 1024);
          keyLight.shadow.bias = -0.0005;
          keyLight.shadow.normalBias = 0.02;
          scene.add(keyLight);

          const rimLight = new THREE.DirectionalLight('#7dd3fc', 0.95);
          rimLight.position.set(-520, -240, -480);
          scene.add(rimLight);

          const rootGroup = new THREE.Group();
          scene.add(rootGroup);
          sceneGroupRef.current = rootGroup;

          const printableGroup = new THREE.Group();
          rootGroup.add(printableGroup);
          printableGroupRef.current = printableGroup;

          let frameId = 0;
          let disposed = false;

          const renderLoop = () => {
            if (disposed) return;
            controls.update();
            renderer.render(scene, camera);
            if (!isSoftwareGl) frameId = requestAnimationFrame(renderLoop);
          };

          const onControlChange = () => {
            if (isSoftwareGl && !disposed) renderer.render(scene, camera);
          };
          controls.addEventListener('change', onControlChange);

          const onResize = () => {
            if (!container || disposed) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.render(scene, camera);
          };
          window.addEventListener('resize', onResize);

          renderLoop();
          if (isSoftwareGl) renderer.render(scene, camera);

          return () => {
            disposed = true;
            cancelAnimationFrame(frameId);
            window.removeEventListener('resize', onResize);
            controls.removeEventListener('change', onControlChange);
            controls.dispose();
            renderer.dispose();
            if (renderer.domElement.parentNode === container) container.removeChild(renderer.domElement);
          };
        }, [threeReady]);

        useEffect(() => {
          if (!threeReady || !sceneGroupRef.current || !printableGroupRef.current) return;
          const { THREE } = window.THREE_KIT;
          const root = sceneGroupRef.current;
          const printableRoot = printableGroupRef.current;

          const disposeChildren = (grp) => {
            while (grp.children.length > 0) {
              const child = grp.children[0];
              if (child === printableRoot) {
                grp.remove(child);
                continue;
              }
              grp.remove(child);
              child.traverse?.((obj) => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                  if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
                  else obj.material.dispose();
                }
              });
            }
          };

          disposeChildren(printableRoot);
          disposeChildren(root);
          root.add(printableRoot);

          const boardW = board.cols * board.pitch;
          const boardH = board.rows * board.pitch;
          const boardThick = board.thicknessMm || 6.0;
          const boardColorObj = BOARD_COLORS.find((c) => c.id === board.colorId) || BOARD_COLORS[0];

          const boardMat = new THREE.MeshStandardMaterial({ color: boardColorObj.fill, roughness: 0.56, metalness: 0.32 });
          const rimMat = new THREE.MeshStandardMaterial({ color: boardColorObj.rim, roughness: 0.48, metalness: 0.42 });
          const holeMat = new THREE.MeshStandardMaterial({ color: boardColorObj.hole, roughness: 0.9, metalness: 0.05 });

          // 1. VERKTØYTAVLE (BAKPLATE) MED RUTENETT AV HULL
          if (!isolateSelected) {
            const boardGroup = new THREE.Group();
            const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(boardW, boardH, boardThick), boardMat);
            boardMesh.position.set(0, 0, -boardThick / 2);
            boardMesh.receiveShadow = true;
            boardGroup.add(boardMesh);

            const borderT = 4;
            const topBar = new THREE.Mesh(new THREE.BoxGeometry(boardW + borderT * 2, borderT, boardThick + 1), rimMat);
            topBar.position.set(0, boardH / 2 + borderT / 2, -boardThick / 2);
            const botBar = topBar.clone();
            botBar.position.y = -boardH / 2 - borderT / 2;
            const leftBar = new THREE.Mesh(new THREE.BoxGeometry(borderT, boardH, boardThick + 1), rimMat);
            leftBar.position.set(-boardW / 2 - borderT / 2, 0, -boardThick / 2);
            const rightBar = leftBar.clone();
            rightBar.position.x = boardW / 2 + borderT / 2;
            boardGroup.add(topBar, botBar, leftBar, rightBar);

            const totalHoles = board.cols * board.rows;
            const holeCylGeo = new THREE.CylinderGeometry(board.holeDiameter / 2, board.holeDiameter / 2, boardThick + 0.5, 12);
            holeCylGeo.rotateX(Math.PI / 2);
            const instHoles = new THREE.InstancedMesh(holeCylGeo, holeMat, totalHoles);
            const dummy = new THREE.Object3D();
            let idx = 0;
            for (let r = 0; r < board.rows; r++) {
              for (let c = 0; c < board.cols; c++) {
                dummy.position.set(-boardW / 2 + (c + 0.5) * board.pitch, boardH / 2 - (r + 0.5) * board.pitch, -boardThick / 2);
                dummy.updateMatrix();
                instHoles.setMatrixAt(idx++, dummy.matrix);
              }
            }
            instHoles.computeBoundingSphere();
            boardGroup.add(instHoles);

            const standoffGeo = new THREE.CylinderGeometry(5, 5, 10, 14);
            standoffGeo.rotateX(Math.PI / 2);
            [
              [-boardW / 2 + 18, boardH / 2 - 18],
              [boardW / 2 - 18, boardH / 2 - 18],
              [-boardW / 2 + 18, -boardH / 2 + 18],
              [boardW / 2 - 18, -boardH / 2 + 18],
            ].forEach(([sx, sy]) => {
              const standoff = new THREE.Mesh(standoffGeo, rimMat);
              standoff.position.set(sx, sy, -boardThick - 5);
              boardGroup.add(standoff);
            });

            root.add(boardGroup);
          }

          // 2. PARAMETRISKE 3D-HOLDERE + VALGFRIE VERKTØY
          const { toolsRoot } = buildHolders3D(THREE, items, board, mount, {
            selectedId,
            isolateSelected,
            showTools: showTools3D,
            targetPrintableGroup: printableRoot,
          });
          if (showTools3D) {
            root.add(toolsRoot);
          }
        }, [threeReady, board, mount, items, selectedId, isolateSelected, showTools3D]);

        const handleExportSTL = () => {
          const fname = isolateSelected && selectedId ? `holder-${selectedId}.stl` : 'verktoyholdere.stl';
          const res = exportHoldersToBinarySTL(items, board, mount, {
            filename: fname,
            selectedId,
            isolateSelected,
          });
          setExportStatus(res.ok ? 'STL-fil lastet ned!' : res.message);
          onNotifyStl?.(res);
          setTimeout(() => setExportStatus(''), 2800);
        };

        const setCameraPreset = (preset) => {
          if (!cameraRef.current || !controlsRef.current) return;
          const cam = cameraRef.current;
          const ctrl = controlsRef.current;
          ctrl.target.set(0, 0, 0);
          if (preset === 'front') cam.position.set(0, 0, 980);
          else if (preset === 'angle') cam.position.set(280, -200, 900);
          else if (preset === 'back') cam.position.set(260, 120, -680);
          ctrl.update();
        };

        return (
          <div className="relative w-full h-full bg-[#0f1c2e]">
            <div ref={mountRef} className="w-full h-full" />

            {/* Kameravinkel-hurtigvalg oppe til venstre */}
            <div className="absolute top-3 left-4 z-10 flex items-center gap-1.5 bg-[#132338] border border-[#263f61] rounded-lg p-1">
              <button
                onClick={() => setCameraPreset('front')}
                className="px-2.5 py-1 rounded text-xs font-medium text-slate-200 hover:bg-[#1c3352] whitespace-nowrap"
              >
                Forfra
              </button>
              <button
                onClick={() => setCameraPreset('angle')}
                className="px-2.5 py-1 rounded text-xs font-medium text-slate-200 hover:bg-[#1c3352] whitespace-nowrap"
              >
                Skrått 3/4
              </button>
              <button
                onClick={() => setCameraPreset('back')}
                title="Roter bak tavlen for å se skruehullene"
                className="px-2.5 py-1 rounded text-xs font-medium text-sky-200 hover:bg-[#1c3352] whitespace-nowrap"
              >
                Bakside (skruehull)
              </button>
            </div>

            {/* Kontroller oppe til høyre */}
            <div className="absolute top-3 right-4 z-10 flex items-center gap-2">
              <button
                onClick={() => setIsolateSelected((v) => !v)}
                disabled={!selectedId}
                className={`px-3 py-1.5 rounded-md text-xs font-medium border transition-colors whitespace-nowrap ${
                  isolateSelected
                    ? 'bg-sky-200 text-slate-950 border-sky-200'
                    : 'bg-[#132338] text-slate-200 border-[#263f61] hover:border-sky-400/60 disabled:opacity-40'
                }`}
              >
                {isolateSelected ? 'Viser valgt holder' : 'Isoler valgt'}
              </button>
              <button
                onClick={() => setShowTools3D((v) => !v)}
                className={`px-3 py-1.5 rounded-md text-xs font-medium border transition-colors whitespace-nowrap ${
                  showTools3D
                    ? 'bg-[#182b44] text-sky-200 border-sky-400/50'
                    : 'bg-[#132338] text-slate-300 border-[#263f61]'
                }`}
              >
                {showTools3D ? 'Verktøy: Vises' : 'Kun holdere'}
              </button>
              <button
                onClick={handleExportSTL}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold bg-sky-200 text-slate-950 hover:bg-sky-100 transition-colors whitespace-nowrap"
              >
                <Icon name="download" className="w-3.5 h-3.5" />
                <span>{exportStatus || 'Last ned STL'}</span>
              </button>
            </div>

            {/* Norsk hjelpetekst for kamerastyring */}
            <div className="absolute bottom-3 left-4 z-10 px-3 py-1.5 rounded-md bg-[#0b1523]/90 border border-[#243b5c] text-xs text-slate-300 pointer-events-none">
              Kamerastyring: Venstreklikk + dra for å rotere · Høyreklikk + dra for å panorere · Musehjul for å zoome
            </div>
          </div>
        );
      }

      // ============================================================================
      // 5. HOVEDAPPLIKASJON
      // ============================================================================

      function App() {
        const loadInitial = () => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed && parsed.board && Array.isArray(parsed.items)) {
                const validMount = parsed.mount && MOUNT_STYLES.some((s) => s.id === parsed.mount.styleId);
                const normalizedMount = validMount ? parsed.mount : INITIAL_MOUNT;
                const normalizedItems = parsed.items.map((it) => {
                  const dims = computeItemDimensions(it.type, it.config);
                  return { ...it, ...dims };
                });
                return {
                  board: parsed.board,
                  mount: normalizedMount,
                  items: normalizedItems,
                };
              }
            }
          } catch {}
          return { board: INITIAL_BOARD, mount: INITIAL_MOUNT, items: INITIAL_ITEMS };
        };

        const initial = useMemo(() => loadInitial(), []);
        const [board, setBoard] = useState(initial.board);
        const [mount, setMount] = useState(initial.mount);
        const [items, setItems] = useState(initial.items);

        const [past, setPast] = useState([]);
        const [future, setFuture] = useState([]);

        const [activeRail, setActiveRail] = useState('add');
        const [viewMode, setViewMode] = useState('planner');
        const [selectedId, setSelectedId] = useState(initial.items[0]?.id || null);
        const [searchQuery, setSearchQuery] = useState('');
        const [categoryFilter, setCategoryFilter] = useState('Alle');
        const [openFitIdx, setOpenFitIdx] = useState(null);
        const [pocketDepthOpen, setPocketDepthOpen] = useState(false);
        const [forkFitOpen, setForkFitOpen] = useState(true);
        const [mountPlaceOpen, setMountPlaceOpen] = useState(false);

        const [snapToGrid, setSnapToGrid] = useState(true);
        const [showYourTools, setShowYourTools] = useState(true);
        const [showLiftOut, setShowLiftOut] = useState(false);

        const viewportRef = useRef(null);
        const [zoom, setZoom] = useState(0.76);
        const [pan, setPan] = useState({ x: 40, y: 24 });
        const [dragInfo, setDragInfo] = useState(null);

        const boardWidthMm = board.cols * board.pitch;
        const boardHeightMm = board.rows * board.pitch;
        const boardColorObj = BOARD_COLORS.find((c) => c.id === board.colorId) || BOARD_COLORS[0];

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ board, mount, items }));
          } catch {}
        }, [board, mount, items]);

        const fitBoard = useCallback(() => {
          if (!viewportRef.current) return;
          const rect = viewportRef.current.getBoundingClientRect();
          const scaleX = (rect.width - 140) / boardWidthMm;
          const scaleY = (rect.height - 120) / boardHeightMm;
          const nextZoom = Math.max(0.25, Math.min(2.2, Math.min(scaleX, scaleY)));
          setZoom(nextZoom);
          setPan({
            x: (rect.width - boardWidthMm * nextZoom) / 2,
            y: (rect.height - boardHeightMm * nextZoom) / 2 - 8,
          });
        }, [boardWidthMm, boardHeightMm]);

        useEffect(() => {
          fitBoard();
          window.addEventListener('resize', fitBoard);
          return () => window.removeEventListener('resize', fitBoard);
        }, [fitBoard]);

        const zoomToItem = useCallback(() => {
          const item = items.find((i) => i.id === selectedId);
          if (!item || !viewportRef.current) return;
          const rect = viewportRef.current.getBoundingClientRect();
          const scaleX = (rect.width * 0.55) / item.widthMm;
          const scaleY = (rect.height * 0.55) / item.heightMm;
          const nextZoom = Math.max(0.4, Math.min(2.4, Math.min(scaleX, scaleY)));
          setZoom(nextZoom);
          setPan({
            x: rect.width / 2 - (item.xMm + item.widthMm / 2) * nextZoom,
            y: rect.height / 2 - (item.yMm + item.heightMm / 2) * nextZoom,
          });
        }, [items, selectedId]);

        const commitItems = useCallback(
          (nextItems) => {
            setPast((prev) => [...prev.slice(-39), items]);
            setFuture([]);
            setItems(nextItems);
          },
          [items]
        );

        const handleUndo = useCallback(() => {
          if (past.length === 0) return;
          const previous = past[past.length - 1];
          setPast((prev) => prev.slice(0, -1));
          setFuture((prev) => [items, ...prev]);
          setItems(previous);
          if (selectedId && !previous.some((i) => i.id === selectedId)) {
            setSelectedId(previous[0]?.id || null);
          }
        }, [past, items, selectedId]);

        const handleRedo = useCallback(() => {
          if (future.length === 0) return;
          const next = future[0];
          setFuture((prev) => prev.slice(1));
          setPast((prev) => [...prev, items]);
          setItems(next);
        }, [future, items]);

        const snapItem = useCallback(
          (valX, valY, item) => snapItemPosition(valX, valY, item, board, mount, snapToGrid),
          [board, mount, snapToGrid]
        );

        const updateBoard = useCallback(
          (patch) => {
            const nextBoard = { ...board, ...patch };
            setBoard(nextBoard);
            if (snapToGrid && (patch.pitch !== undefined || patch.cols !== undefined || patch.rows !== undefined)) {
              setItems((prev) =>
                prev.map((it) => ({
                  ...it,
                  ...snapItemPosition(it.xMm, it.yMm, it, nextBoard, mount, true),
                }))
              );
            }
          },
          [board, mount, snapToGrid]
        );

        const findOpenSpot = useCallback(
          (wMm, hMm) => {
            const step = board.pitch;
            for (let y = step; y + hMm <= boardHeightMm; y += step * 2) {
              for (let x = step; x + wMm <= boardWidthMm; x += step * 2) {
                const overlaps = items.some((it) => {
                  const iw = it.rotation % 180 === 0 ? it.widthMm : it.heightMm;
                  const ih = it.rotation % 180 === 0 ? it.heightMm : it.widthMm;
                  return !(x + wMm + 8 <= it.xMm || x >= it.xMm + iw + 8 || y + hMm + 8 <= it.yMm || y >= it.yMm + ih + 8);
                });
                if (!overlaps) return { xMm: Number(x.toFixed(2)), yMm: Number(y.toFixed(2)) };
              }
            }
            return { xMm: step, yMm: step };
          },
          [items, board.pitch, boardWidthMm, boardHeightMm]
        );

        const addToolToBoard = useCallback(
          (catalogTool, dropPos = null) => {
            const configCopy = JSON.parse(JSON.stringify(catalogTool.defaultConfig));
            const dims = computeItemDimensions(catalogTool.id, configCopy);
            const draftItem = { type: catalogTool.id, rotation: 0, config: configCopy, ...dims };
            const pos = dropPos
              ? snapItem(dropPos.xMm - dims.widthMm / 2, dropPos.yMm - dims.heightMm / 2, draftItem)
              : findOpenSpot(dims.widthMm, dims.heightMm);

            const newItem = {
              id: `item-${catalogTool.id}-${Date.now().toString(36)}`,
              type: catalogTool.id,
              name: catalogTool.name,
              xMm: pos.xMm,
              yMm: pos.yMm,
              rotation: 0,
              config: configCopy,
              widthMm: dims.widthMm,
              heightMm: dims.heightMm,
              liftOutMm: catalogTool.liftOutMm,
            };

            commitItems([...items, newItem]);
            setSelectedId(newItem.id);
            setViewMode('planner');
          },
          [items, commitItems, findOpenSpot, snapItem]
        );

        const removeItem = useCallback(
          (id) => {
            const next = items.filter((i) => i.id !== id);
            commitItems(next);
            if (selectedId === id) setSelectedId(next[0]?.id || null);
          },
          [items, selectedId, commitItems]
        );

        const duplicateItem = useCallback(
          (id) => {
            const src = items.find((i) => i.id === id);
            if (!src) return;
            const pos = findOpenSpot(src.widthMm, src.heightMm);
            const copy = {
              ...JSON.parse(JSON.stringify(src)),
              id: `item-${src.type}-${Date.now().toString(36)}`,
              name: `${src.name} (kopi)`,
              xMm: pos.xMm,
              yMm: pos.yMm,
              rotation: 0,
            };
            commitItems([...items, copy]);
            setSelectedId(copy.id);
          },
          [items, commitItems, findOpenSpot]
        );

        const updateSelectedItem = useCallback(
          (updater) => {
            if (!selectedId) return;
            const next = items.map((it) => {
              if (it.id !== selectedId) return it;
              const updated = typeof updater === 'function' ? updater(it) : { ...it, ...updater };
              const dims = computeItemDimensions(updated.type, updated.config);
              const withDims = { ...updated, ...dims };
              if (snapToGrid) {
                const snapped = snapItemPosition(withDims.xMm, withDims.yMm, withDims, board, mount, true);
                return { ...withDims, ...snapped };
              }
              return withDims;
            });
            commitItems(next);
          },
          [selectedId, items, commitItems, snapToGrid, board, mount]
        );

        useEffect(() => {
          const onKeyDown = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
              e.preventDefault();
              if (e.shiftKey) handleRedo();
              else handleUndo();
            } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') {
              e.preventDefault();
              handleRedo();
            } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
              e.preventDefault();
              removeItem(selectedId);
            } else if (e.key.toLowerCase() === 'r' && selectedId) {
              e.preventDefault();
              updateSelectedItem((it) => ({ ...it, rotation: (it.rotation + 90) % 360 }));
            } else if (e.key === 'Escape') {
              setSelectedId(null);
            }
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [handleUndo, handleRedo, selectedId, removeItem, updateSelectedItem]);

        const handleItemPointerDown = (e, item) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          setSelectedId(item.id);
          setDragInfo({
            type: 'item',
            itemId: item.id,
            startClientX: e.clientX,
            startClientY: e.clientY,
            origX: item.xMm,
            origY: item.yMm,
            snapshotItems: items,
            moved: false,
          });
        };

        const handleResizeHandlePointerDown = (e, item, corner) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          setSelectedId(item.id);
          const pf = normalizePliersConfig(item.type, item.config);
          setDragInfo({
            type: 'resize-pliers',
            itemId: item.id,
            corner,
            startClientX: e.clientX,
            startClientY: e.clientY,
            origItem: item,
            origPliers: pf,
            snapshotItems: items,
            moved: false,
          });
        };

        const handleViewportPointerDown = (e) => {
          if (e.button !== 0) return;
          if (e.target === viewportRef.current || e.target.dataset.boardBg === 'true') {
            setSelectedId(null);
          }
          setDragInfo({
            type: 'pan',
            startClientX: e.clientX,
            startClientY: e.clientY,
            origX: pan.x,
            origY: pan.y,
          });
        };

        useEffect(() => {
          if (!dragInfo) return;
          const onPointerMove = (e) => {
            const dx = e.clientX - dragInfo.startClientX;
            const dy = e.clientY - dragInfo.startClientY;
            if (dragInfo.type === 'pan') {
              setPan({ x: dragInfo.origX + dx, y: dragInfo.origY + dy });
              return;
            }
            if (dragInfo.type === 'item') {
              setItems((prev) =>
                prev.map((it) => {
                  if (it.id !== dragInfo.itemId) return it;
                  const snapped = snapItem(dragInfo.origX + dx / zoom, dragInfo.origY + dy / zoom, it);
                  return {
                    ...it,
                    xMm: snapped.xMm,
                    yMm: snapped.yMm,
                  };
                })
              );
              if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragInfo.moved = true;
              return;
            }
            if (dragInfo.type === 'resize-pliers') {
              const signY = dragInfo.corner.includes('n') ? -1 : 1;
              const signX = dragInfo.corner.includes('w') ? -1 : 1;
              const deltaH = (dy / zoom) * signY;
              const deltaW = (dx / zoom) * signX * 2;
              const origP = dragInfo.origPliers;
              let nextConfig;
              if (origP.keepProportions) {
                const targetLen = Math.max(90, Math.min(340, origP.overallLengthMm + deltaH));
                nextConfig = applyPliersFieldUpdate(dragInfo.origItem.type, dragInfo.origItem.config, 'overallLengthMm', targetLen);
              } else {
                const step1 = applyPliersFieldUpdate(dragInfo.origItem.type, dragInfo.origItem.config, 'overallLengthMm', origP.overallLengthMm + deltaH);
                nextConfig = applyPliersFieldUpdate(dragInfo.origItem.type, step1, 'handleSpreadMm', origP.handleSpreadMm + deltaW);
              }
              setItems((prev) =>
                prev.map((it) => {
                  if (it.id !== dragInfo.itemId) return it;
                  const dims = computeItemDimensions(it.type, nextConfig);
                  const updated = { ...it, config: nextConfig, ...dims };
                  if (snapToGrid) {
                    const snapped = snapItemPosition(updated.xMm, updated.yMm, updated, board, mount, true);
                    return { ...updated, ...snapped };
                  }
                  return updated;
                })
              );
              if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragInfo.moved = true;
            }
          };
          const onPointerUp = () => {
            if ((dragInfo.type === 'item' || dragInfo.type === 'resize-pliers') && dragInfo.moved) {
              setPast((prev) => [...prev.slice(-39), dragInfo.snapshotItems]);
              setFuture([]);
            }
            setDragInfo(null);
          };
          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          return () => {
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
          };
        }, [dragInfo, zoom, snapItem, snapToGrid, board, mount]);

        const handleWheel = (e) => {
          if (viewMode !== 'planner' || !viewportRef.current) return;
          e.preventDefault();
          const rect = viewportRef.current.getBoundingClientRect();
          const cursorX = e.clientX - rect.left;
          const cursorY = e.clientY - rect.top;
          const factor = e.deltaY < 0 ? 1.1 : 0.91;
          const nextZoom = Math.max(0.25, Math.min(2.8, zoom * factor));
          const ratio = nextZoom / zoom;
          setPan({ x: cursorX - (cursorX - pan.x) * ratio, y: cursorY - (cursorY - pan.y) * ratio });
          setZoom(nextZoom);
        };

        const handleCanvasDrop = (e) => {
          e.preventDefault();
          const toolId = e.dataTransfer.getData('text/tool-id');
          if (!toolId || !viewportRef.current) return;
