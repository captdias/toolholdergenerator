                            <line x1={-21} y1={0} x2={-11} y2={0} stroke="#3b5a80" strokeWidth={1.1} />
                            <line x1={-21} y1={boardHeightMm} x2={-11} y2={boardHeightMm} stroke="#3b5a80" strokeWidth={1.1} />
                            <text x={-24} y={boardHeightMm / 2} textAnchor="middle" fill="#7dd3fc" fontSize="11" fontFamily="JetBrains Mono, monospace" transform={`rotate(-90, -24, ${boardHeightMm / 2})`}>
                              {boardHeightMm.toFixed(1)} mm
                            </text>
                          </g>

                          <g className="pointer-events-none">
                            <line x1={0} y1={-16} x2={boardWidthMm} y2={-16} stroke="#3b5a80" strokeWidth={1.1} />
                            <line x1={0} y1={-21} x2={0} y2={-11} stroke="#3b5a80" strokeWidth={1.1} />
                            <line x1={boardWidthMm} y1={-21} x2={boardWidthMm} y2={-11} stroke="#3b5a80" strokeWidth={1.1} />
                            <text x={boardWidthMm / 2} y={-22} textAnchor="middle" fill="#7dd3fc" fontSize="11" fontFamily="JetBrains Mono, monospace">
                              {boardWidthMm.toFixed(1)} mm
                            </text>
                          </g>

                          {items.map((item) => {
                            const isSelected = item.id === selectedId;
                            const liftMm = item.liftOutMm || mount.clearanceMm || 38;
                            const isPliers = isPliersType(item.type);
                            const pf = isPliers ? normalizePliersConfig(item.type, item.config) : null;
                            const handleR = Math.max(3.2, 4.2 / Math.max(0.5, zoom));
                            return (
                              <g
                                key={item.id}
                                transform={`translate(${item.xMm}, ${item.yMm}) rotate(${item.rotation}, ${item.widthMm / 2}, ${item.heightMm / 2})`}
                                onPointerDown={(e) => handleItemPointerDown(e, item)}
                                className="cursor-move"
                              >
                                {showLiftOut && (
                                  <rect x={0} y={-liftMm} width={item.widthMm} height={liftMm} rx={3} fill="url(#liftOutHatch)" stroke="rgba(125,211,252,0.5)" strokeWidth={0.9} strokeDasharray="4 3" />
                                )}

                                <ToolIllustrationSVG item={item} pitch={board.pitch} mount={mount} showTool={showYourTools} />

                                <rect
                                  x={-2}
                                  y={-2}
                                  width={item.widthMm + 4}
                                  height={item.heightMm + 4}
                                  rx={4}
                                  fill="transparent"
                                  stroke={isSelected ? '#93c5fd' : 'rgba(148,163,184,0.22)'}
                                  strokeWidth={isSelected ? 2 / Math.max(0.5, zoom) : 0.8}
                                />

                                {isSelected && isPliers && (
                                  <g>
                                    <g transform={`translate(${item.widthMm / 2}, -14)`}>
                                      <rect x={-52} y={-13} width={104} height={17} rx={4} fill="#0d1829" stroke="#60a5fa" strokeWidth={1} />
                                      <text x={0} y={-2} textAnchor="middle" fill="#e0f2fe" fontSize="8.5" fontWeight="600" fontFamily="JetBrains Mono, monospace">
                                        {`${item.name} · ${pf.overallLengthMm.toFixed(1)} mm`}
                                      </text>
                                    </g>
                                    {[
                                      { key: 'nw', x: -2, y: -2, cursor: 'nwse-resize' },
                                      { key: 'ne', x: item.widthMm + 2, y: -2, cursor: 'nesw-resize' },
                                      { key: 'sw', x: -2, y: item.heightMm + 2, cursor: 'nesw-resize' },
                                      { key: 'se', x: item.widthMm + 2, y: item.heightMm + 2, cursor: 'nwse-resize' },
                                    ].map((hCorner) => (
                                      <circle
                                        key={hCorner.key}
                                        cx={hCorner.x}
                                        cy={hCorner.y}
                                        r={handleR}
                                        fill="#38bdf8"
                                        stroke="#0b1523"
                                        strokeWidth={1.2}
                                        style={{ cursor: hCorner.cursor }}
                                        onPointerDown={(e) => handleResizeHandlePointerDown(e, item, hCorner.key)}
                                      />
                                    ))}
                                  </g>
                                )}

                                {!isSelected && (
                                  <g transform={`translate(${item.widthMm / 2}, -10)`}>
                                    <rect x={-Math.max(40, item.name.length * 3.5)} y={-12} width={Math.max(80, item.name.length * 7.0)} height={16} rx={4} fill="#0d1829" stroke="#2d4a70" strokeWidth={0.9} />
                                    <text x={0} y={-1.5} textAnchor="middle" fill="#e2e8f0" fontSize="8.5" fontWeight="500">
                                      {item.name}
                                    </text>
                                  </g>
                                )}
                              </g>
                            );
                          })}
                        </g>
                      </svg>

                      <div className="no-print absolute bottom-3 left-4 pointer-events-none text-xs text-slate-400">
                        Velg et verktøy for å redigere · dra for å flytte · dra på tom tavle for å panorere · rull for å zoome
                      </div>

                      <div className="no-print absolute bottom-3 right-4 flex items-center gap-1.5 bg-[#0f1c2e]/95 border border-[#243b5c] rounded-lg p-1">
                        <button
                          onClick={zoomToItem}
                          disabled={!selectedItem}
                          title="Zoom inn på valgt verktøy"
                          className="px-2.5 py-1.5 rounded text-xs font-medium text-slate-200 hover:bg-[#192e4a] disabled:opacity-40 whitespace-nowrap"
                        >
                          Zoom til valgt
                        </button>
                        <button
                          onClick={() => setZoom((z) => Math.max(0.25, Number((z * 0.85).toFixed(2))))}
                          aria-label="Zoom ut"
                          title="Zoom ut"
                          className="w-7 h-7 rounded flex items-center justify-center text-slate-200 hover:bg-[#192e4a]"
                        >
                          <Icon name="minus" className="w-3.5 h-3.5" />
                        </button>
                        <button
                          onClick={fitBoard}
                          title="Tilpass hele tavlen til skjermen"
                          className="px-2.5 py-1.5 rounded text-xs font-medium text-slate-200 hover:bg-[#192e4a] whitespace-nowrap tabular-nums"
                        >
                          Tilpass tavle ({Math.round(zoom * 100)}%)
                        </button>
                        <button
                          onClick={() => setZoom((z) => Math.min(2.8, Number((z * 1.18).toFixed(2))))}
                          aria-label="Zoom inn"
                          title="Zoom inn"
                          className="w-7 h-7 rounded flex items-center justify-center text-slate-200 hover:bg-[#192e4a]"
                        >
                          <Icon name="plus" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* BUNNLINJE FOR VALGT ELEMENT */}
                <div className="no-print h-14 shrink-0 px-5 border-t border-[#1b2e47] bg-[#0d192b] flex items-center justify-between gap-4">
                  {selectedItem ? (
                    <>
                      <div className="flex items-center gap-4 min-w-0">
                        <div className="min-w-0">
                          <div className="text-sm font-semibold text-slate-100 truncate">{selectedItem.name}</div>
                          <div className="text-xs text-slate-400 font-mono tabular-nums truncate">
                            {(() => {
                              const layout = computeHolderLayout(selectedItem, board.pitch, mount);
                              const ref = layout.holes[0];
                              const { rx, ry } = getRotatedLocalPoint(ref.lx, ref.ly, selectedItem.widthMm, selectedItem.heightMm, selectedItem.rotation);
                              const c = Math.round((selectedItem.xMm + rx) / board.pitch - 0.5) + 1;
                              const r = Math.round((selectedItem.yMm + ry) / board.pitch - 0.5) + 1;
                              return `${selectedItem.widthMm} × ${selectedItem.heightMm} mm · ${layout.holes.length} skruehull · Rutenett (${c}, ${r})`;
                            })()}
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 shrink-0">
                        <button
                          onClick={() => setViewMode(viewMode === '3d' ? 'planner' : '3d')}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-sky-400/60 text-xs font-medium text-slate-200 whitespace-nowrap"
                        >
                          <Icon name="cube" className="w-3.5 h-3.5" />
                          <span>{viewMode === '3d' ? 'Tilbake til 2D' : 'Se holder'}</span>
                        </button>
                        <button
                          onClick={() => setActiveRail('edit')}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-sky-400/60 text-xs font-medium text-slate-200 whitespace-nowrap"
                        >
                          <Icon name="edit" className="w-3.5 h-3.5" />
                          <span>Rediger</span>
                        </button>
                        <button
                          onClick={() => removeItem(selectedItem.id)}
                          aria-label="Slett valgt verktøy"
                          title="Slett valgt verktøy (Delete)"
                          className="flex items-center justify-center p-1.5 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-rose-400/70 text-slate-300 hover:text-rose-200"
                        >
                          <Icon name="trash" className="w-4 h-4" />
                        </button>
                        <span className="hidden lg:inline-flex items-center gap-1.5 ml-2 text-xs text-slate-400 tabular-nums whitespace-nowrap">
                          <Icon name="check" className="w-3.5 h-3.5 text-sky-300" />
                          {totalParts} {totalParts === 1 ? 'del klar' : 'deler klare'}
                        </span>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="text-xs text-slate-400">
                        Klikk på et verktøykort til venstre for å legge det til, eller velg et verktøy på tavlen for å redigere.
                      </div>
                      <div className="flex items-center gap-1.5 text-xs text-slate-400 tabular-nums whitespace-nowrap">
                        <Icon name="check" className="w-3.5 h-3.5 text-sky-300" />
                        <span>{totalParts} {totalParts === 1 ? 'del klar' : 'deler klare'}</span>
                      </div>
                    </>
                  )}
                </div>
              </main>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
