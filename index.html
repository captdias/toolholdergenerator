<!doctype html>
<html lang="no" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verktøytavle – Planlegger</title>
    <meta name="description" content="Interaktiv 2D-planlegger og 3D-visning for verktøytavle og egendefinerte holdere." />
    <meta property="og:title" content="Verktøytavle – Planlegger" />
    <meta property="og:description" content="Interaktiv 2D-planlegger og 3D-visning for verktøytavle og egendefinerte holdere." />
    <meta property="og:type" content="website" />

    <!-- Fonter: Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {

    <!-- React 18 & Babel Standalone CDN -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Three.js r169 (inkl. OrbitControls, STLExporter og RoomEnvironment) via Import Map -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
    <script>
      (function () {
        var mod = document.createElement('script');
        mod.type = 'module';
        mod.textContent = [
          "import * as THREE from 'three';",
          "import { OrbitControls } from 'three/addons/controls/OrbitControls.js';",
          "import { STLExporter } from 'three/addons/exporters/STLExporter.js';",
          "import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';",
          "window.THREE_KIT = { THREE, OrbitControls, STLExporter, RoomEnvironment };",
          "window.dispatchEvent(new Event('three-kit-ready'));",
        ].join('\n');
        document.head.appendChild(mod);
      })();
    </script>

    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background-color: #0b1523;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: #0b1523; }
      ::-webkit-scrollbar-thumb { background: #233854; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #335077; }
      .tabular-nums { font-variant-numeric: tabular-nums; }
      @media print {
        body { background: #ffffff !important; color: #0f172a !important; }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body class="overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      // ============================================================================
      // 1. KONSTANTER, VERKTØYKATALOG OG STANDARDOPPSETT
      // ============================================================================

      const STORAGE_KEY = 'verktoytavle_plan_v1';

      const BOARD_COLORS = [
        { id: 'slate', name: 'Skiferstål', fill: '#273a4c', hole: '#0c1522', rim: '#3b536b' },
        { id: 'charcoal', name: 'Matt kullgrå', fill: '#1f2937', hole: '#090d14', rim: '#374151' },
        { id: 'cobalt', name: 'Verkstedblå', fill: '#1b314d', hole: '#08121f', rim: '#2f507a' },
        { id: 'birch', name: 'Naturbjørk', fill: '#7a6348', hole: '#241c13', rim: '#997e5e' },
      ];

      const BOARD_PRESETS = [
        { id: 'std', label: '914 × 660 mm (36 × 26 hull)', cols: 36, rows: 26, pitch: 25.4 },
        { id: 'compact', label: '610 × 457 mm (24 × 18 hull)', cols: 24, rows: 18, pitch: 25.4 },
        { id: 'wide', label: '1168 × 732 mm (46 × 28 hull)', cols: 46, rows: 28, pitch: 25.4 },
        { id: 'metric', label: '800 × 600 mm (40 × 30 metrisk)', cols: 40, rows: 30, pitch: 20.0 },
      ];

      const MOUNT_STYLES = [
        { id: 'standard_peg', name: 'Standard 1/4" krok', pegDia: 6.0, clearance: 38 },
        { id: 'locking_screw', name: 'Låsbar skrueplugg', pegDia: 6.2, clearance: 32 },
        { id: 'skadis_tab', name: 'Spor / Skådis T-krok', pegDia: 5.0, clearance: 35 },
      ];

      const TOOL_CATALOG = [
        {
          id: 'tang',
          name: 'Tang',
          category: 'Håndverktøy',
          subtitle: 'Holder for universaltang',
          defaultWidthMm: 76.2,
          defaultHeightMm: 177.8,
          liftOutMm: 44,
          defaultConfig: {},
          tags: ['tang', 'kombinasjonstang', 'universaltang', 'håndverktøy'],
        },
        {
          id: 'spisstang',
          name: 'Spisstang',
          category: 'Håndverktøy',
          subtitle: 'Smal holder for nebbtang',
          defaultWidthMm: 72.0,
          defaultHeightMm: 186.0,
          liftOutMm: 44,
          defaultConfig: {},
          tags: ['spisstang', 'nebbtang', 'radiotang', 'presisjon'],
        },
        {
          id: 'avbiter',
          name: 'Avbiter',
          category: 'Håndverktøy',
          subtitle: 'Kort holder for sideavbiter',
          defaultWidthMm: 74.0,
          defaultHeightMm: 164.0,
          liftOutMm: 42,
          defaultConfig: {},
          tags: ['avbiter', 'sideavbiter', 'kutter', 'kabel'],
        },
        {
          id: 'klohammer',
          name: 'Klohammer',
          category: 'Håndverktøy',
          subtitle: 'Dobbel gaffelholder for hammer',
          defaultWidthMm: 127.0,
          defaultHeightMm: 304.8,
          liftOutMm: 52,
          defaultConfig: {},
          tags: ['klohammer', 'hammer', 'snekkerhammer', 'slagverktøy'],
        },
        {
          id: 'bitsholder',
          name: 'Bitsholder',
          category: 'Holdere',
          subtitle: 'Skinne for 1/4" sekskantbits',
          defaultWidthMm: 127.0,
          defaultHeightMm: 44.5,
          liftOutMm: 32,
          defaultConfig: {
            bits: ['T15', 'T20', 'T25', 'PH1', 'PH2', 'PZ2', 'SL5', 'H4', 'H5', 'H6'],
            bitCount: 10,
          },
          tags: ['bitsholder', 'bits', 'torx', 'skrubits', 'holder'],
        },
        {
          id: 'fastnokkelholder',
          name: 'Fastnøkkelholder',
          category: 'Holdere',
          subtitle: 'Gradert holder for fastnøkkelsett',
          defaultWidthMm: 237.6,
          defaultHeightMm: 268.6,
          liftOutMm: 48,
          defaultConfig: { unit: 'mm', sizes: [8, 10, 12, 13, 14, 17, 19] },
          tags: ['fastnøkkelholder', 'fastnøkkel', 'nøkkel', 'metrisk', 'holder'],
        },
        {
          id: 'skrutrekkerholder',
          name: 'Skrutrekkerholder',
          category: 'Holdere',
          subtitle: '5-spors vertikal skrutrekkerlist',
          defaultWidthMm: 177.8,
          defaultHeightMm: 210.0,
          liftOutMm: 46,
          defaultConfig: { slots: 5 },
          tags: ['skrutrekkerholder', 'skrutrekker', 'jern', 'holder'],
        },
        {
          id: 'maleband',
          name: 'Målebånd',
          category: 'Håndverktøy',
          subtitle: 'Belteklips-brakett for målebånd',
          defaultWidthMm: 88.9,
          defaultHeightMm: 101.6,
          liftOutMm: 38,
          defaultConfig: {},
          tags: ['målebånd', 'tommestokk', 'måling'],
        },
      ];

      function computeItemDimensions(type, config) {
        if (type === 'fastnokkelholder') {
          const sizes = (config && config.sizes) || [8, 10, 12, 13, 14, 17, 19];
          const count = Math.max(1, sizes.length);
          const maxSize = Math.max(...sizes.map((s) => Number(s) || 10), 10);
          const width = Math.max(84, count * 30.5 + 24);
          const height = Math.min(340, Math.max(150, 130 + maxSize * 7.2));
          return { widthMm: Number(width.toFixed(2)), heightMm: Number(height.toFixed(2)) };
        }
        if (type === 'bitsholder') {
          const count = (config && config.bits ? config.bits.length : config?.bitCount) || 10;
          const width = Math.max(76, count * 12.2 + 16);
          return { widthMm: Number(width.toFixed(2)), heightMm: 44.5 };
        }
        if (type === 'skrutrekkerholder') {
          const slots = (config && config.slots) || 5;
          return { widthMm: Number((slots * 32 + 18).toFixed(2)), heightMm: 210.0 };
        }
        const cat = TOOL_CATALOG.find((t) => t.id === type);
        return {
          widthMm: cat ? cat.defaultWidthMm : 80,
          heightMm: cat ? cat.defaultHeightMm : 120,
        };
      }

      const INITIAL_BOARD = {
        cols: 36,
        rows: 26,
        pitch: 25.4,
        holeDiameter: 6.0,
        colorId: 'slate',
        thicknessMm: 6.0,
      };

      const INITIAL_MOUNT = {
        styleId: 'standard_peg',
        clearanceMm: 38,
      };

      const INITIAL_ITEMS = [
        {
          id: 'item-fastnokkel-1',
          type: 'fastnokkelholder',
          name: 'Fastnøkkelholder',
          xMm: 25.4 * 2,
          yMm: 25.4 * 1,
          rotation: 0,
          config: { unit: 'mm', sizes: [8, 10, 12, 13, 14, 17, 19] },
          ...computeItemDimensions('fastnokkelholder', { sizes: [8, 10, 12, 13, 14, 17, 19] }),
          liftOutMm: 48,
        },
        {
          id: 'item-bits-1',
          type: 'bitsholder',
          name: 'Bitsholder',
          xMm: 25.4 * 14,
          yMm: 25.4 * 3,
          rotation: 0,
          config: { bits: ['T15', 'T20', 'T25', 'PH1', 'PH2', 'PZ2', 'SL5', 'H4', 'H5', 'H6'], bitCount: 10 },
          ...computeItemDimensions('bitsholder', { bitCount: 10 }),
          liftOutMm: 32,
        },
      ];

      // ============================================================================
      // 2. VEKTORIKONER (1.75px strek)
      // ============================================================================

      const Icon = ({ name, className = 'w-5 h-5' }) => {
        const props = {
          className,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: 1.75,
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
        };
        switch (name) {
          case 'board':
            return (
              <svg {...props}>
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
              </svg>
            );
          case 'plus':
            return <svg {...props}><path d="M12 5v14M5 12h14" /></svg>;
          case 'minus':
            return <svg {...props}><path d="M5 12h14" /></svg>;
          case 'edit':
            return (
              <svg {...props}>
                <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" />
              </svg>
            );
          case 'mount':
            return (
              <svg {...props}>
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
              </svg>
            );
          case 'download':
            return (
              <svg {...props}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
            );
          case 'print':
            return (
              <svg {...props}>
                <polyline points="6 9 6 2 18 2 18 9" />
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                <rect x="6" y="14" width="12" height="8" />
              </svg>
            );
          case 'search':
            return (
              <svg {...props}>
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
            );
          case 'undo':
            return (
              <svg {...props}>
                <path d="M3 7v6h6" />
                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
              </svg>
            );
          case 'redo':
            return (
              <svg {...props}>
                <path d="M21 7v6h-6" />
                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13" />
              </svg>
            );
          case 'cube':
            return (
              <svg {...props}>
                <path d="m21 16-9 5-9-5V8l9-5 9 5Z" />
                <path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12" />
              </svg>
            );
          case 'copy':
            return (
              <svg {...props}>
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            );
          case 'trash':
            return (
              <svg {...props}>
                <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
              </svg>
            );
          case 'rotate':
            return (
              <svg {...props}>
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
              </svg>
            );
          case 'check':
            return <svg {...props}><polyline points="20 6 9 17 4 12" /></svg>;
          case 'x':
            return <svg {...props}><path d="M18 6 6 18M6 6l12 12" /></svg>;
          default:
            return null;
        }
      };

      // ============================================================================
      // 3. DETALJERT SVG-TEGNING AV VERKTØY OG HOLDERE
      // ============================================================================

      function ToolIllustrationSVG({ item, showTool = true, isPreview = false }) {
        const w = item.widthMm;
        const h = item.heightMm;
        const holderFill = '#2a415b';
        const holderStroke = '#7ba7d7';
        const metalFill = '#cbd5e1';

        if (item.type === 'fastnokkelholder') {
          const sizes = (item.config && item.config.sizes) || [8, 10, 12, 13, 14, 17, 19];
          const unit = (item.config && item.config.unit) || 'mm';
          const padX = 14;
          const usableW = Math.max(40, w - padX * 2);
          const step = sizes.length > 1 ? usableW / (sizes.length - 1) : 0;
          const maxSize = Math.max(...sizes.map((s) => Number(s) || 10), 14);

          return (
            <g>
              <rect x={0} y={0} width={w} height={h} rx={4} fill="rgba(26, 44, 66, 0.45)" stroke={holderStroke} strokeWidth={1.1} />
              <rect x={4} y={6} width={w - 8} height={36} rx={3} fill={holderFill} stroke="#60a5fa" strokeWidth={1.1} />
              <circle cx={14} cy={14} r={2.6} fill="#0c1522" stroke="#60a5fa" strokeWidth={0.8} />
              <circle cx={w - 14} cy={14} r={2.6} fill="#0c1522" stroke="#60a5fa" strokeWidth={0.8} />

              {sizes.map((sz, idx) => {
                const cx = sizes.length === 1 ? w / 2 : padX + idx * step;
                const num = Number(sz) || 10;
                const ratio = Math.min(1, Math.max(0.38, num / maxSize));
                const wrenchLen = 95 + ratio * (h - 115);
                const headR = 5.5 + ratio * 6.5;
                const shaftW = 4.2 + ratio * 4.6;

                return (
                  <g key={idx}>
                    <rect x={cx - shaftW * 0.85} y={18} width={shaftW * 1.7} height={22} rx={2} fill="#1b2d42" stroke="#93c5fd" strokeWidth={0.8} />
                    {!isPreview && (
                      <text x={cx} y={13.5} textAnchor="middle" fill="#cbd5e1" fontSize="6.5" fontFamily="JetBrains Mono, monospace">
                        {sz}{unit === 'mm' ? '' : '"'}
                      </text>
                    )}
                    {showTool && (
                      <g>
                        <circle cx={cx} cy={28} r={headR} fill={metalFill} stroke="#475569" strokeWidth={0.9} />
                        <rect x={cx - headR * 0.42} y={28 - headR - 1} width={headR * 0.84} height={headR * 1.1} fill="#1c2a3a" />
                        <rect x={cx - shaftW / 2} y={28 + headR * 0.55} width={shaftW} height={wrenchLen - headR * 1.3} rx={1.5} fill="url(#chromeGrad)" stroke="#64748b" strokeWidth={0.7} />
                        <circle cx={cx} cy={28 + wrenchLen - headR * 0.5} r={headR * 0.82} fill={metalFill} stroke="#475569" strokeWidth={0.9} />
                        <circle cx={cx} cy={28 + wrenchLen - headR * 0.5} r={headR * 0.42} fill="#1f3145" />
                      </g>
                    )}
                  </g>
                );
              })}
            </g>
          );
        }

        if (item.type === 'bitsholder') {
          const bits = (item.config && item.config.bits) || ['T15', 'T20', 'T25', 'PH1', 'PH2', 'PZ2', 'SL5', 'H4'];
          const pad = 10;
          const step = bits.length > 0 ? (w - pad * 2) / bits.length : 12;
          return (
            <g>
              <rect x={0} y={0} width={w} height={h} rx={4} fill={holderFill} stroke={holderStroke} strokeWidth={1.2} />
              <rect x={4} y={4} width={w - 8} height={11} rx={2} fill="#1d3046" />
              <circle cx={10} cy={9.5} r={2} fill="#0c1522" stroke="#60a5fa" strokeWidth={0.7} />
              <circle cx={w - 10} cy={9.5} r={2} fill="#0c1522" stroke="#60a5fa" strokeWidth={0.7} />
              {bits.map((label, i) => {
                const bx = pad + i * step + step / 2;
                return (
                  <g key={i}>
                    <rect x={bx - 4.5} y={19} width={9} height={10} rx={1.5} fill="#122133" stroke="#60a5fa" strokeWidth={0.7} />
                    {showTool && (
                      <g>
                        <rect x={bx - 3.2} y={13} width={6.4} height={13} rx={1} fill={metalFill} stroke="#475569" strokeWidth={0.6} />
                        <polygon points={`${bx - 2.2},13 ${bx + 2.2},13 ${bx + 1.4},9.5 ${bx - 1.4},9.5`} fill="#94a3b8" />
                      </g>
                    )}
                    {!isPreview && (
                      <text x={bx} y={38.5} textAnchor="middle" fill="#93c5fd" fontSize="4.6" fontFamily="JetBrains Mono, monospace">
                        {label}
                      </text>
                    )}
                  </g>
                );
              })}
            </g>
          );
        }

        if (item.type === 'tang' || item.type === 'spisstang' || item.type === 'avbiter') {
          const cx = w / 2;
          const isNeedle = item.type === 'spisstang';
          const isCutter = item.type === 'avbiter';
          const jawPath = isNeedle
            ? `M ${cx - 1.5} 6 L ${cx - 7} 48 L ${cx} 54 L ${cx + 7} 48 L ${cx + 1.5} 6 Z`
            : isCutter
            ? `M ${cx - 8} 20 Q ${cx} 12 ${cx + 8} 20 L ${cx + 9} 44 L ${cx} 50 L ${cx - 9} 44 Z`
            : `M ${cx - 5} 12 L ${cx - 9} 44 L ${cx} 50 L ${cx + 9} 44 L ${cx + 5} 12 Z`;

          const gripColor = isCutter ? '#0284c7' : isNeedle ? '#2563eb' : '#1d4ed8';

          return (
            <g>
              <rect x={6} y={4} width={w - 12} height={46} rx={4} fill={holderFill} stroke={holderStroke} strokeWidth={1.1} />
              <rect x={cx - 15} y={32} width={8} height={16} rx={3} fill="#365475" stroke="#93c5fd" strokeWidth={0.9} />
              <rect x={cx + 7} y={32} width={8} height={16} rx={3} fill="#365475" stroke="#93c5fd" strokeWidth={0.9} />
              <circle cx={16} cy={14} r={2.4} fill="#0c1522" stroke="#60a5fa" strokeWidth={0.7} />
              <circle cx={w - 16} cy={14} r={2.4} fill="#0c1522" stroke="#60a5fa" strokeWidth={0.7} />
              {showTool && (
                <g>
                  <path d={jawPath} fill={metalFill} stroke="#475569" strokeWidth={0.9} />
                  <circle cx={cx} cy={46} r={5.5} fill="#94a3b8" stroke="#334155" strokeWidth={0.9} />
                  <circle cx={cx} cy={46} r={2} fill="#475569" />
                  <path
                    d={`M ${cx - 5} 51 Q ${cx - 21} 96 ${cx - 17} ${h - 10} Q ${cx - 13} ${h - 4} ${cx - 8} ${h - 10} Q ${cx - 10} 92 ${cx - 2} 54 Z`}
                    fill={gripColor}
                    stroke="#60a5fa"
                    strokeWidth={0.9}
                  />
                  <path
                    d={`M ${cx + 5} 51 Q ${cx + 21} 96 ${cx + 17} ${h - 10} Q ${cx + 13} ${h - 4} ${cx + 8} ${h - 10} Q ${cx + 10} 92 ${cx + 2} 54 Z`}
                    fill={gripColor}
                    stroke="#60a5fa"
                    strokeWidth={0.9}
                  />
                </g>
              )}
            </g>
          );
        }

        if (item.type === 'klohammer') {
          const cx = w / 2;
          return (
            <g>
              <rect x={14} y={8} width={w - 28} height={66} rx={5} fill={holderFill} stroke={holderStroke} strokeWidth={1.2} />
              <rect x={cx - 26} y={40} width={12} height={32} rx={4} fill="#365475" stroke="#93c5fd" strokeWidth={0.9} />
              <rect x={cx + 14} y={40} width={12} height={32} rx={4} fill="#365475" stroke="#93c5fd" strokeWidth={0.9} />
              <circle cx={26} cy={18} r={2.6} fill="#0c1522" stroke="#60a5fa" strokeWidth={0.8} />
              <circle cx={w - 26} cy={18} r={2.6} fill="#0c1522" stroke="#60a5fa" strokeWidth={0.8} />
              {showTool && (
                <g>
                  <rect x={cx - 9} y={36} width={18} height={h - 48} rx={7} fill="#d9a066" stroke="#854d0e" strokeWidth={1} />
                  <rect x={cx - 10.5} y={h - 115} width={21} height={102} rx={7} fill="#1e293b" stroke="#475569" strokeWidth={1} />
                  <path
                    d={`M ${cx - 50} 26 L ${cx + 14} 24 Q ${cx + 42} 25 ${cx + 54} 42 Q ${cx + 38} 38 ${cx + 18} 44 L ${cx - 32} 44 L ${cx - 36} 48 L ${cx - 50} 48 Z`}
                    fill={metalFill}
                    stroke="#475569"
                    strokeWidth={1.1}
                  />
                  <rect x={cx - 54} y={24} width={8} height={26} rx={2} fill="#e2e8f0" stroke="#475569" strokeWidth={1} />
                </g>
              )}
            </g>
          );
        }

        if (item.type === 'skrutrekkerholder') {
          const slots = (item.config && item.config.slots) || 5;
          const step = (w - 24) / slots;
          return (
            <g>
              <rect x={2} y={4} width={w - 4} height={34} rx={4} fill={holderFill} stroke={holderStroke} strokeWidth={1.1} />
              {Array.from({ length: slots }).map((_, i) => {
                const sx = 12 + i * step + step / 2;
                const bladeLen = 95 + (i % 3) * 28;
                return (
                  <g key={i}>
                    <circle cx={sx} cy={22} r={7} fill="#16273c" stroke="#93c5fd" strokeWidth={0.9} />
                    {showTool && (
                      <g>
                        <rect x={sx - 7.5} y={6} width={15} height={46} rx={5} fill="#2563eb" stroke="#60a5fa" strokeWidth={0.8} />
                        <rect x={sx - 2.2} y={52} width={4.4} height={bladeLen} rx={1} fill={metalFill} stroke="#475569" strokeWidth={0.7} />
                      </g>
                    )}
                  </g>
                );
              })}
            </g>
          );
        }

        // Målebånd
        return (
          <g>
            <rect x={6} y={6} width={w - 12} height={h - 12} rx={6} fill={holderFill} stroke={holderStroke} strokeWidth={1.1} />
            <rect x={w / 2 - 14} y={24} width={28} height={10} rx={2} fill="#152436" stroke="#93c5fd" strokeWidth={0.9} />
            {showTool && (
              <g>
                <rect x={14} y={18} width={w - 28} height={h - 32} rx={14} fill="#eab308" stroke="#a16207" strokeWidth={1.2} />
                <rect x={22} y={28} width={w - 44} height={h - 52} rx={8} fill="#1e293b" />
                <circle cx={w / 2} cy={h / 2 + 2} r={11} fill="#334155" stroke="#64748b" strokeWidth={1} />
              </g>
            )}
          </g>
        );
      }

      // ============================================================================
      // 4. 3D-VISNING (Three.js + OrbitControls + STLExporter)
      // ============================================================================

      function ThreeDInspectionView({ board, items, selectedId }) {
        const mountRef = useRef(null);
        const [threeReady, setThreeReady] = useState(Boolean(window.THREE_KIT));
        const [isolateSelected, setIsolateSelected] = useState(false);
        const [showTools3D, setShowTools3D] = useState(true);
        const [exportStatus, setExportStatus] = useState('');
        const sceneGroupRef = useRef(null);
        const cameraRef = useRef(null);
        const controlsRef = useRef(null);

        useEffect(() => {
          if (window.THREE_KIT) {
            setThreeReady(true);
            return;
          }
          const handler = () => setThreeReady(true);
          window.addEventListener('three-kit-ready', handler);
          return () => window.removeEventListener('three-kit-ready', handler);
        }, []);

        useEffect(() => {
          if (!threeReady || !mountRef.current) return;
          const { THREE, OrbitControls, RoomEnvironment } = window.THREE_KIT;
          const container = mountRef.current;

          const isSoftwareGl = (() => {
            try {
              const c = document.createElement('canvas');
              const gl = c.getContext('webgl2') || c.getContext('webgl');
              if (!gl) return true;
              const ext = gl.getExtension('WEBGL_debug_renderer_info');
              const gpu = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : String(gl.getParameter(gl.RENDERER));
              gl.getExtension('WEBGL_lose_context')?.loseContext();
              return /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpu);
            } catch {
              return true;
            }
          })();

          const renderer = new THREE.WebGLRenderer({ antialias: !isSoftwareGl, powerPreference: 'high-performance' });
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.1;
          renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio, 2));
          renderer.shadowMap.enabled = !isSoftwareGl;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.setSize(container.clientWidth, container.clientHeight);
          container.appendChild(renderer.domElement);

          const scene = new THREE.Scene();
          scene.background = new THREE.Color('#0f1c2e');
          scene.fog = new THREE.Fog('#0f1c2e', 1400, 3400);

          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
          pmrem.dispose();

          const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 1, 6000);
          camera.position.set(0, -180, 950);
          cameraRef.current = camera;

          const controls = new OrbitControls(camera, renderer.domElement);
          controls.enableDamping = !isSoftwareGl;
          controls.dampingFactor = 0.07;
          controlsRef.current = controls;

          scene.add(new THREE.HemisphereLight('#bfd8ff', '#162436', 0.85));
          const keyLight = new THREE.DirectionalLight('#fff6eb', 1.85);
          keyLight.position.set(450, 520, 720);
          keyLight.castShadow = !isSoftwareGl;
          scene.add(keyLight);

          const rimLight = new THREE.DirectionalLight('#60a5fa', 0.9);
          rimLight.position.set(-500, -250, -400);
          scene.add(rimLight);

          const exportRoot = new THREE.Group();
          scene.add(exportRoot);
          sceneGroupRef.current = exportRoot;

          let frameId = 0;
          let disposed = false;

          const renderLoop = () => {
            if (disposed) return;
            controls.update();
            renderer.render(scene, camera);
            if (!isSoftwareGl) frameId = requestAnimationFrame(renderLoop);
          };

          const onControlChange = () => {
            if (isSoftwareGl && !disposed) renderer.render(scene, camera);
          };
          controls.addEventListener('change', onControlChange);

          const onResize = () => {
            if (!container || disposed) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.render(scene, camera);
          };
          window.addEventListener('resize', onResize);

          renderLoop();
          if (isSoftwareGl) renderer.render(scene, camera);

          return () => {
            disposed = true;
            cancelAnimationFrame(frameId);
            window.removeEventListener('resize', onResize);
            controls.removeEventListener('change', onControlChange);
            controls.dispose();
            renderer.dispose();
            if (renderer.domElement.parentNode === container) container.removeChild(renderer.domElement);
          };
        }, [threeReady]);

        useEffect(() => {
          if (!threeReady || !sceneGroupRef.current) return;
          const { THREE } = window.THREE_KIT;
          const root = sceneGroupRef.current;

          while (root.children.length > 0) {
            const child = root.children[0];
            root.remove(child);
            child.traverse?.((obj) => {
              if (obj.geometry) obj.geometry.dispose();
              if (obj.material) {
                if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
                else obj.material.dispose();
              }
            });
          }

          const boardW = board.cols * board.pitch;
          const boardH = board.rows * board.pitch;
          const boardColorObj = BOARD_COLORS.find((c) => c.id === board.colorId) || BOARD_COLORS[0];

          const boardMat = new THREE.MeshStandardMaterial({ color: boardColorObj.fill, roughness: 0.58, metalness: 0.35 });
          const holderMat = new THREE.MeshStandardMaterial({ color: '#3b82f6', roughness: 0.38, metalness: 0.12 });
          const holderSelectedMat = new THREE.MeshStandardMaterial({ color: '#93c5fd', roughness: 0.32, metalness: 0.18 });
          const steelMat = new THREE.MeshStandardMaterial({ color: '#cbd5e1', roughness: 0.25, metalness: 0.88 });
          const gripMat = new THREE.MeshStandardMaterial({ color: '#1d4ed8', roughness: 0.72, metalness: 0.05 });

          if (!isolateSelected) {
            const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(boardW, boardH, board.thicknessMm), boardMat);
            boardMesh.position.set(0, 0, -board.thicknessMm / 2);
            root.add(boardMesh);

            const holeGeo = new THREE.CircleGeometry(board.holeDiameter / 2, 12);
            const holeMat = new THREE.MeshBasicMaterial({ color: boardColorObj.hole });
            const instHoles = new THREE.InstancedMesh(holeGeo, holeMat, board.cols * board.rows);
            const dummy = new THREE.Object3D();
            let idx = 0;
            for (let r = 0; r < board.rows; r++) {
              for (let c = 0; c < board.cols; c++) {
                dummy.position.set(-boardW / 2 + (c + 0.5) * board.pitch, boardH / 2 - (r + 0.5) * board.pitch, 0.25);
                dummy.updateMatrix();
                instHoles.setMatrixAt(idx++, dummy.matrix);
              }
            }
            instHoles.computeBoundingSphere();
            root.add(instHoles);
          }

          const visibleItems = isolateSelected && selectedId ? items.filter((it) => it.id === selectedId) : items;

          visibleItems.forEach((item) => {
            const g = new THREE.Group();
            const mat = item.id === selectedId ? holderSelectedMat : holderMat;
            const cx = isolateSelected ? 0 : -boardW / 2 + item.xMm + item.widthMm / 2;
            const cy = isolateSelected ? 0 : boardH / 2 - item.yMm - item.heightMm / 2;
            g.position.set(cx, cy, 0);
            g.rotation.z = -(item.rotation * Math.PI) / 180;

            const plateH = item.type === 'bitsholder' ? item.heightMm : Math.min(item.heightMm, 52);
            const plate = new THREE.Mesh(new THREE.BoxGeometry(item.widthMm - 8, plateH, 5), mat);
            plate.position.set(0, item.heightMm / 2 - plateH / 2 - 4, 2.5);
            g.add(plate);

            const pegL = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 10, 12), mat);
            pegL.rotation.x = Math.PI / 2;
            pegL.position.set(-item.widthMm / 2 + 16, item.heightMm / 2 - 14, -4);
            g.add(pegL);
            const pegR = pegL.clone();
            pegR.position.x = item.widthMm / 2 - 16;
            g.add(pegR);

            if (item.type === 'fastnokkelholder') {
              const sizes = (item.config && item.config.sizes) || [8, 10, 12, 13, 14, 17, 19];
              const shelf = new THREE.Mesh(new THREE.BoxGeometry(item.widthMm - 10, 12, 34), mat);
              shelf.position.set(0, item.heightMm / 2 - 28, 17);
              g.add(shelf);
              const usableW = Math.max(40, item.widthMm - 28);
              const step = sizes.length > 1 ? usableW / (sizes.length - 1) : 0;
              sizes.forEach((sz, i) => {
                const wx = sizes.length === 1 ? 0 : -usableW / 2 + i * step;
                if (showTools3D) {
                  const len = Math.min(item.heightMm - 32, 95 + Number(sz) * 6.5);
                  const wrench = new THREE.Mesh(new THREE.BoxGeometry(7, len, 4.5), steelMat);
                  wrench.position.set(wx, item.heightMm / 2 - 28 - len / 2 + 10, 22);
                  g.add(wrench);
                }
              });
            } else if (item.type === 'bitsholder') {
              const shelf = new THREE.Mesh(new THREE.BoxGeometry(item.widthMm - 6, 18, 26), mat);
              shelf.position.set(0, -4, 13);
              g.add(shelf);
              const bits = (item.config && item.config.bits) || [];
              const step = bits.length ? (item.widthMm - 20) / bits.length : 12;
              if (showTools3D) {
                bits.forEach((_, i) => {
                  const bx = -(item.widthMm - 20) / 2 + i * step + step / 2;
                  const bit = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 24, 6), steelMat);
                  bit.position.set(bx, 10, 14);
                  g.add(bit);
                });
              }
            } else if (item.type === 'klohammer') {
              [-20, 20].forEach((fx) => {
                const fork = new THREE.Mesh(new THREE.BoxGeometry(10, 14, 42), mat);
                fork.position.set(fx, item.heightMm / 2 - 36, 21);
                g.add(fork);
              });
              if (showTools3D) {
                const head = new THREE.Mesh(new THREE.BoxGeometry(106, 24, 24), steelMat);
                head.position.set(0, item.heightMm / 2 - 26, 24);
                g.add(head);
                const shaft = new THREE.Mesh(new THREE.CylinderGeometry(9, 10, item.heightMm - 60, 12), gripMat);
                shaft.position.set(0, -14, 24);
                g.add(shaft);
              }
            } else {
              [-14, 14].forEach((px) => {
                const prong = new THREE.Mesh(new THREE.BoxGeometry(8, 12, 32), mat);
                prong.position.set(px, item.heightMm / 2 - 36, 16);
                g.add(prong);
              });
              if (showTools3D) {
                const body = new THREE.Mesh(new THREE.BoxGeometry(22, item.heightMm - 36, 12), gripMat);
                body.position.set(0, -10, 18);
                g.add(body);
              }
            }
            root.add(g);
          });
        }, [threeReady, board, items, selectedId, isolateSelected, showTools3D]);

        const handleExportSTL = () => {
          if (!window.THREE_KIT || !sceneGroupRef.current) return;
          const exporter = new window.THREE_KIT.STLExporter();
          const stlString = exporter.parse(sceneGroupRef.current);
          const blob = new Blob([stlString], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = isolateSelected && selectedId ? `holder-${selectedId}.stl` : 'verktoytavle.stl';
          a.click();
          URL.revokeObjectURL(url);
          setExportStatus('STL eksportert');
          setTimeout(() => setExportStatus(''), 2500);
        };

        const resetCamera = () => {
          if (cameraRef.current && controlsRef.current) {
            cameraRef.current.position.set(0, -180, 950);
            controlsRef.current.target.set(0, 0, 0);
            controlsRef.current.update();
          }
        };

        return (
          <div className="relative w-full h-full bg-[#0f1c2e]">
            <div ref={mountRef} className="w-full h-full" />
            <div className="absolute top-3 right-4 z-10 flex items-center gap-2">
              <button
                onClick={() => setIsolateSelected((v) => !v)}
                disabled={!selectedId}
                className={`px-3 py-1.5 rounded-md text-xs font-medium border transition-colors whitespace-nowrap ${
                  isolateSelected
                    ? 'bg-sky-200 text-slate-950 border-sky-200'
                    : 'bg-[#132338] text-slate-200 border-[#263f61] hover:border-sky-400/60 disabled:opacity-40'
                }`}
              >
                {isolateSelected ? 'Viser valgt holder' : 'Isoler valgt'}
              </button>
              <button
                onClick={() => setShowTools3D((v) => !v)}
                className={`px-3 py-1.5 rounded-md text-xs font-medium border transition-colors whitespace-nowrap ${
                  showTools3D
                    ? 'bg-[#182b44] text-sky-200 border-sky-400/50'
                    : 'bg-[#132338] text-slate-300 border-[#263f61]'
                }`}
              >
                {showTools3D ? 'Verktøy: Vises' : 'Kun holdere'}
              </button>
              <button
                onClick={resetCamera}
                className="px-3 py-1.5 rounded-md text-xs font-medium bg-[#132338] text-slate-200 border border-[#263f61] hover:border-sky-400/60 whitespace-nowrap"
              >
                Nullstill visning
              </button>
              <button
                onClick={handleExportSTL}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold bg-sky-200 text-slate-950 hover:bg-sky-100 transition-colors whitespace-nowrap"
              >
                <Icon name="download" className="w-3.5 h-3.5" />
                <span>{exportStatus || 'Eksporter STL'}</span>
              </button>
            </div>
            <div className="absolute bottom-3 left-4 z-10 text-xs text-slate-400 pointer-events-none">
              Dra for å rotere · Høyreklikk-dra for å panorere · Rull for å zoome
            </div>
          </div>
        );
      }

      // ============================================================================
      // 5. HOVEDAPPLIKASJON
      // ============================================================================

      function App() {
        const loadInitial = () => {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed && parsed.board && Array.isArray(parsed.items)) return parsed;
            }
          } catch {}
          return { board: INITIAL_BOARD, mount: INITIAL_MOUNT, items: INITIAL_ITEMS };
        };

        const initial = useMemo(() => loadInitial(), []);
        const [board, setBoard] = useState(initial.board);
        const [mount, setMount] = useState(initial.mount || INITIAL_MOUNT);
        const [items, setItems] = useState(initial.items);

        const [past, setPast] = useState([]);
        const [future, setFuture] = useState([]);

        const [activeRail, setActiveRail] = useState('add');
        const [viewMode, setViewMode] = useState('planner');
        const [selectedId, setSelectedId] = useState(initial.items[0]?.id || null);
        const [searchQuery, setSearchQuery] = useState('');
        const [categoryFilter, setCategoryFilter] = useState('Alle');

        const [snapToGrid, setSnapToGrid] = useState(true);
        const [showYourTools, setShowYourTools] = useState(true);
        const [showLiftOut, setShowLiftOut] = useState(false);

        const viewportRef = useRef(null);
        const [zoom, setZoom] = useState(0.76);
        const [pan, setPan] = useState({ x: 40, y: 24 });
        const [dragInfo, setDragInfo] = useState(null);

        const boardWidthMm = board.cols * board.pitch;
        const boardHeightMm = board.rows * board.pitch;
        const boardColorObj = BOARD_COLORS.find((c) => c.id === board.colorId) || BOARD_COLORS[0];

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ board, mount, items }));
          } catch {}
        }, [board, mount, items]);

        const fitBoard = useCallback(() => {
          if (!viewportRef.current) return;
          const rect = viewportRef.current.getBoundingClientRect();
          const scaleX = (rect.width - 140) / boardWidthMm;
          const scaleY = (rect.height - 120) / boardHeightMm;
          const nextZoom = Math.max(0.25, Math.min(2.2, Math.min(scaleX, scaleY)));
          setZoom(nextZoom);
          setPan({
            x: (rect.width - boardWidthMm * nextZoom) / 2,
            y: (rect.height - boardHeightMm * nextZoom) / 2 - 8,
          });
        }, [boardWidthMm, boardHeightMm]);

        useEffect(() => {
          fitBoard();
          window.addEventListener('resize', fitBoard);
          return () => window.removeEventListener('resize', fitBoard);
        }, [fitBoard]);

        const zoomToItem = useCallback(() => {
          const item = items.find((i) => i.id === selectedId);
          if (!item || !viewportRef.current) return;
          const rect = viewportRef.current.getBoundingClientRect();
          const scaleX = (rect.width * 0.55) / item.widthMm;
          const scaleY = (rect.height * 0.55) / item.heightMm;
          const nextZoom = Math.max(0.4, Math.min(2.4, Math.min(scaleX, scaleY)));
          setZoom(nextZoom);
          setPan({
            x: rect.width / 2 - (item.xMm + item.widthMm / 2) * nextZoom,
            y: rect.height / 2 - (item.yMm + item.heightMm / 2) * nextZoom,
          });
        }, [items, selectedId]);

        const commitItems = useCallback(
          (nextItems) => {
            setPast((prev) => [...prev.slice(-39), items]);
            setFuture([]);
            setItems(nextItems);
          },
          [items]
        );

        const handleUndo = useCallback(() => {
          if (past.length === 0) return;
          const previous = past[past.length - 1];
          setPast((prev) => prev.slice(0, -1));
          setFuture((prev) => [items, ...prev]);
          setItems(previous);
          if (selectedId && !previous.some((i) => i.id === selectedId)) {
            setSelectedId(previous[0]?.id || null);
          }
        }, [past, items, selectedId]);

        const handleRedo = useCallback(() => {
          if (future.length === 0) return;
          const next = future[0];
          setFuture((prev) => prev.slice(1));
          setPast((prev) => [...prev, items]);
          setItems(next);
        }, [future, items]);

        const snapCoord = useCallback(
          (valMm, maxMm, sizeMm) => {
            const clamped = Math.max(0, Math.min(maxMm - sizeMm, valMm));
            if (!snapToGrid) return Number(clamped.toFixed(1));
            const snapped = Math.round(clamped / board.pitch) * board.pitch;
            return Number(Math.max(0, Math.min(maxMm - sizeMm, snapped)).toFixed(2));
          },
          [snapToGrid, board.pitch]
        );

        const findOpenSpot = useCallback(
          (wMm, hMm) => {
            const step = board.pitch;
            for (let y = step; y + hMm <= boardHeightMm; y += step * 2) {
              for (let x = step; x + wMm <= boardWidthMm; x += step * 2) {
                const overlaps = items.some((it) => {
                  const iw = it.rotation % 180 === 0 ? it.widthMm : it.heightMm;
                  const ih = it.rotation % 180 === 0 ? it.heightMm : it.widthMm;
                  return !(x + wMm + 8 <= it.xMm || x >= it.xMm + iw + 8 || y + hMm + 8 <= it.yMm || y >= it.yMm + ih + 8);
                });
                if (!overlaps) return { xMm: Number(x.toFixed(2)), yMm: Number(y.toFixed(2)) };
              }
            }
            return { xMm: step, yMm: step };
          },
          [items, board.pitch, boardWidthMm, boardHeightMm]
        );

        const addToolToBoard = useCallback(
          (catalogTool, dropPos = null) => {
            const configCopy = JSON.parse(JSON.stringify(catalogTool.defaultConfig));
            const dims = computeItemDimensions(catalogTool.id, configCopy);
            const pos = dropPos
              ? {
                  xMm: snapCoord(dropPos.xMm - dims.widthMm / 2, boardWidthMm, dims.widthMm),
                  yMm: snapCoord(dropPos.yMm - dims.heightMm / 2, boardHeightMm, dims.heightMm),
                }
              : findOpenSpot(dims.widthMm, dims.heightMm);

            const newItem = {
              id: `item-${catalogTool.id}-${Date.now().toString(36)}`,
              type: catalogTool.id,
              name: catalogTool.name,
              xMm: pos.xMm,
              yMm: pos.yMm,
              rotation: 0,
              config: configCopy,
              widthMm: dims.widthMm,
              heightMm: dims.heightMm,
              liftOutMm: catalogTool.liftOutMm,
            };

            commitItems([...items, newItem]);
            setSelectedId(newItem.id);
            setViewMode('planner');
          },
          [items, commitItems, findOpenSpot, snapCoord, boardWidthMm, boardHeightMm]
        );

        const removeItem = useCallback(
          (id) => {
            const next = items.filter((i) => i.id !== id);
            commitItems(next);
            if (selectedId === id) setSelectedId(next[0]?.id || null);
          },
          [items, selectedId, commitItems]
        );

        const duplicateItem = useCallback(
          (id) => {
            const src = items.find((i) => i.id === id);
            if (!src) return;
            const pos = findOpenSpot(src.widthMm, src.heightMm);
            const copy = {
              ...JSON.parse(JSON.stringify(src)),
              id: `item-${src.type}-${Date.now().toString(36)}`,
              name: `${src.name} (kopi)`,
              xMm: pos.xMm,
              yMm: pos.yMm,
            };
            commitItems([...items, copy]);
            setSelectedId(copy.id);
          },
          [items, commitItems, findOpenSpot]
        );

        const updateSelectedItem = useCallback(
          (updater) => {
            if (!selectedId) return;
            const next = items.map((it) => {
              if (it.id !== selectedId) return it;
              const updated = typeof updater === 'function' ? updater(it) : { ...it, ...updater };
              const dims = computeItemDimensions(updated.type, updated.config);
              return { ...updated, ...dims };
            });
            commitItems(next);
          },
          [selectedId, items, commitItems]
        );

        useEffect(() => {
          const onKeyDown = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
              e.preventDefault();
              if (e.shiftKey) handleRedo();
              else handleUndo();
            } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') {
              e.preventDefault();
              handleRedo();
            } else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
              e.preventDefault();
              removeItem(selectedId);
            } else if (e.key.toLowerCase() === 'r' && selectedId) {
              e.preventDefault();
              updateSelectedItem((it) => ({ ...it, rotation: (it.rotation + 90) % 360 }));
            } else if (e.key === 'Escape') {
              setSelectedId(null);
            }
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [handleUndo, handleRedo, selectedId, removeItem, updateSelectedItem]);

        const handleItemPointerDown = (e, item) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          setSelectedId(item.id);
          setDragInfo({
            type: 'item',
            itemId: item.id,
            startClientX: e.clientX,
            startClientY: e.clientY,
            origX: item.xMm,
            origY: item.yMm,
            snapshotItems: items,
            moved: false,
          });
        };

        const handleViewportPointerDown = (e) => {
          if (e.button !== 0) return;
          if (e.target === viewportRef.current || e.target.dataset.boardBg === 'true') {
            setSelectedId(null);
          }
          setDragInfo({
            type: 'pan',
            startClientX: e.clientX,
            startClientY: e.clientY,
            origX: pan.x,
            origY: pan.y,
          });
        };

        useEffect(() => {
          if (!dragInfo) return;
          const onPointerMove = (e) => {
            const dx = e.clientX - dragInfo.startClientX;
            const dy = e.clientY - dragInfo.startClientY;
            if (dragInfo.type === 'pan') {
              setPan({ x: dragInfo.origX + dx, y: dragInfo.origY + dy });
              return;
            }
            if (dragInfo.type === 'item') {
              setItems((prev) =>
                prev.map((it) => {
                  if (it.id !== dragInfo.itemId) return it;
                  const effW = it.rotation % 180 === 0 ? it.widthMm : it.heightMm;
                  const effH = it.rotation % 180 === 0 ? it.heightMm : it.widthMm;
                  return {
                    ...it,
                    xMm: snapCoord(dragInfo.origX + dx / zoom, boardWidthMm, effW),
                    yMm: snapCoord(dragInfo.origY + dy / zoom, boardHeightMm, effH),
                  };
                })
              );
              if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragInfo.moved = true;
            }
          };
          const onPointerUp = () => {
            if (dragInfo.type === 'item' && dragInfo.moved) {
              setPast((prev) => [...prev.slice(-39), dragInfo.snapshotItems]);
              setFuture([]);
            }
            setDragInfo(null);
          };
          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          return () => {
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
          };
        }, [dragInfo, zoom, snapCoord, boardWidthMm, boardHeightMm]);

        const handleWheel = (e) => {
          if (viewMode !== 'planner' || !viewportRef.current) return;
          e.preventDefault();
          const rect = viewportRef.current.getBoundingClientRect();
          const cursorX = e.clientX - rect.left;
          const cursorY = e.clientY - rect.top;
          const factor = e.deltaY < 0 ? 1.1 : 0.91;
          const nextZoom = Math.max(0.25, Math.min(2.8, zoom * factor));
          const ratio = nextZoom / zoom;
          setPan({ x: cursorX - (cursorX - pan.x) * ratio, y: cursorY - (cursorY - pan.y) * ratio });
          setZoom(nextZoom);
        };

        const handleCanvasDrop = (e) => {

          addToolToBoard(catalogTool, {
            xMm: (e.clientX - rect.left - pan.x) / zoom,

          });

              tool.tags.some((t) => t.includes(q));
            return matchesCat && matchesQuery;

        }, [searchQuery, categoryFilter]);

              <aside className="no-print w-[308px] shrink-0 bg-[#0f1c2e] border-r border-[#1b2e47] flex flex-col min-h-0">

                                className="py-2 px-3 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-sky-400/60 text-xs font-medium text-slate-200"
                              >
                                Tommer (SAE)

                            <div>

                        <div className="pt-2 border-t border-[#1b2e47] space-y-3">
                          <div className="grid grid-cols-2 gap-2">
                            <div>
                              <label className="block text-[11px] text-slate-400 mb-1">X-posisjon (mm)</label>
                              <input
                                type="number"
                                step={snapToGrid ? board.pitch : 1}

                                className="w-full px-2.5 py-1.5 rounded-lg bg-[#0b1523] border border-[#243b5c] text-xs font-mono tabular-nums text-slate-100"
