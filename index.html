                      })}
                    </div>

                    <div className="grid grid-cols-2 gap-2.5 pt-1">
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Kolonner (hull)</label>
                        <input
                          type="number"
                          min="8"
                          max="80"
                          value={board.cols}
                          onChange={(e) => setBoard({ ...board, cols: Math.max(8, Math.min(80, Number(e.target.value) || 20)) })}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-[#0b1523] border border-[#243b5c] text-xs font-mono tabular-nums text-slate-100"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Rader (hull)</label>
                        <input
                          type="number"
                          min="8"
                          max="60"
                          value={board.rows}
                          onChange={(e) => setBoard({ ...board, rows: Math.max(8, Math.min(60, Number(e.target.value) || 20)) })}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-[#0b1523] border border-[#243b5c] text-xs font-mono tabular-nums text-slate-100"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Hullavstand (mm)</label>
                        <input
                          type="number"
                          step="0.1"
                          min="10"
                          max="50"
                          value={board.pitch}
                          onChange={(e) => setBoard({ ...board, pitch: Math.max(10, Math.min(50, Number(e.target.value) || 25.4)) })}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-[#0b1523] border border-[#243b5c] text-xs font-mono tabular-nums text-slate-100"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Hulldiameter (mm)</label>
                        <input
                          type="number"
                          step="0.5"
                          min="3"
                          max="12"
                          value={board.holeDiameter}
                          onChange={(e) => setBoard({ ...board, holeDiameter: Math.max(3, Math.min(12, Number(e.target.value) || 6)) })}
                          className="w-full px-2.5 py-1.5 rounded-lg bg-[#0b1523] border border-[#243b5c] text-xs font-mono tabular-nums text-slate-100"
                        />
                      </div>
                    </div>

                    <div className="pt-2 border-t border-[#1b2e47]">
                      <div className="text-xs text-slate-400 mb-2">Overflate</div>
                      <div className="grid grid-cols-2 gap-2">
                        {BOARD_COLORS.map((c) => (
                          <button
                            key={c.id}
                            onClick={() => setBoard({ ...board, colorId: c.id })}
                            className={`flex items-center gap-2 px-2.5 py-2 rounded-lg text-xs border transition-colors ${
                              board.colorId === c.id ? 'bg-[#182b44] border-sky-400/70 text-slate-100' : 'bg-[#132338] border-[#223959] text-slate-300'
                            }`}
                          >
                            <span className="w-3.5 h-3.5 rounded-sm border border-white/20 shrink-0" style={{ backgroundColor: c.fill }} />
                            <span className="truncate">{c.name}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="p-3 rounded-lg bg-[#0b1523] border border-[#1b2e47] text-xs font-mono tabular-nums text-slate-300">
                      Total størrelse: {boardWidthMm.toFixed(1)} × {boardHeightMm.toFixed(1)} mm
                    </div>
                  </div>
                )}

                {activeRail === 'mount' && (
                  <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    <div>
                      <h2 className="text-sm font-semibold text-slate-100">Feste og klaring</h2>
                      <p className="text-xs text-slate-400 mt-1">Velg hvordan 3D-printede holdere låses til verktøytavlen.</p>
                    </div>

                    <div className="space-y-2">
                      {MOUNT_STYLES.map((style) => (
                        <button
                          key={style.id}
                          onClick={() => setMount({ ...mount, styleId: style.id, clearanceMm: style.clearance })}
                          className={`w-full text-left p-3 rounded-lg border transition-colors ${
                            mount.styleId === style.id ? 'bg-[#182b44] border-sky-400/70 text-slate-100' : 'bg-[#132338] border-[#223959] text-slate-300 hover:border-sky-400/40'
                          }`}
                        >
                          <div className="text-xs font-semibold">{style.name}</div>
                          <div className="text-[11px] text-slate-400 font-mono tabular-nums mt-1">
                            Plugg: {style.pegDia} mm · Løfteklaring: {style.clearance} mm
                          </div>
                        </button>
                      ))}
                    </div>

                    <div className="pt-2 border-t border-[#1b2e47] space-y-2">
                      <div className="flex items-center justify-between text-xs">
                        <span className="text-slate-300">Standard løfteklaring</span>
                        <span className="font-mono tabular-nums text-sky-300">{mount.clearanceMm} mm</span>
                      </div>
                      <input
                        type="range"
                        min="20"
                        max="80"
                        value={mount.clearanceMm}
                        onChange={(e) => setMount({ ...mount, clearanceMm: Number(e.target.value) })}
                        className="w-full accent-sky-400"
                      />
                    </div>
                  </div>
                )}

                {activeRail === 'print' && (
                  <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    <div>
                      <h2 className="text-sm font-semibold text-slate-100">Nedlasting og utskrift</h2>
                      <p className="text-xs text-slate-400 mt-1">
                        {totalParts} {totalParts === 1 ? 'egendefinert holder klar' : 'egendefinerte holdere klare'} for 3D-visning og STL-eksport.
                      </p>
                    </div>

                    <div className="space-y-2">
                      {items.length === 0 ? (
                        <div className="p-4 rounded-lg bg-[#132338] border border-[#223959] text-xs text-slate-400">
                          Tavlen er tom. Legg til verktøy fra katalogen for å lage en plan.
                        </div>
                      ) : (
                        items.map((it) => (
                          <div
                            key={it.id}
                            onClick={() => setSelectedId(it.id)}
                            className={`p-3 rounded-lg border cursor-pointer transition-colors ${
                              selectedId === it.id ? 'bg-[#182b44] border-sky-400/60' : 'bg-[#132338] border-[#223959] hover:border-sky-400/40'
                            }`}
                          >
                            <div className="flex items-center justify-between text-xs font-semibold text-slate-100">
                              <span className="truncate">{it.name}</span>
                              <span className="text-sky-300 font-mono tabular-nums">1 del</span>
                            </div>
                            <div className="text-[11px] text-slate-400 font-mono tabular-nums mt-1">
                              {it.widthMm} × {it.heightMm} mm · X:{Math.round(it.xMm)} Y:{Math.round(it.yMm)}
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="pt-2 border-t border-[#1b2e47] space-y-2">
                      <button
                        onClick={() => setViewMode('3d')}
                        className="w-full flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg bg-sky-200 text-slate-950 font-semibold text-xs hover:bg-sky-100"
                      >
                        <Icon name="cube" className="w-4 h-4" />
                        <span>Åpne 3D-visning og STL-eksport</span>
                      </button>
                      <button
                        onClick={exportJsonLayout}
                        className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-sky-400/60 text-xs font-medium text-slate-200"
                      >
                        <Icon name="download" className="w-3.5 h-3.5" />
                        <span>Last ned plan (.json)</span>
                      </button>
                      <button
                        onClick={() => window.print()}
                        className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-sky-400/60 text-xs font-medium text-slate-200"
                      >
                        <Icon name="print" className="w-3.5 h-3.5" />
                        <span>Skriv ut oversikt</span>
                      </button>
                    </div>
                  </div>
                )}
              </aside>

              {/* HOVEDOMRÅDE (CANVAS) */}
              <main className="flex-1 flex flex-col min-w-0 bg-[#132030] relative overflow-hidden">
                {/* VERKTØYLINJE ØVERST PÅ LERRETET */}
                <div className="no-print h-12 shrink-0 px-4 border-b border-[#1b2e47] bg-[#0f1c2e] flex items-center justify-between gap-4">
                  {/* Faner: 2D-planlegger / 3D-visning */}
                  <div className="flex items-center p-0.5 rounded-lg bg-[#0b1523] border border-[#203552]">
                    <button
                      onClick={() => setViewMode('planner')}
                      className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-medium transition-colors whitespace-nowrap ${
                        viewMode === 'planner' ? 'bg-[#172b45] text-sky-200 border border-[#3b6ca8]' : 'text-slate-400 hover:text-slate-200 border border-transparent'
                      }`}
                    >
                      <Icon name="board" className="w-3.5 h-3.5" />
                      <span>2D-planlegger</span>
                    </button>
                    <button
                      onClick={() => setViewMode('3d')}
                      className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-xs font-medium transition-colors whitespace-nowrap ${
                        viewMode === '3d' ? 'bg-[#172b45] text-sky-200 border border-[#3b6ca8]' : 'text-slate-400 hover:text-slate-200 border border-transparent'
                      }`}
                    >
                      <Icon name="cube" className="w-3.5 h-3.5" />
                      <span>3D-visning</span>
                    </button>
                  </div>

                  {/* Høyre av/på-kontroller */}
                  <div className="flex items-center gap-4 text-xs">
                    <button
                      onClick={() => setSnapToGrid((v) => !v)}
                      title="Fest verktøy til hullene i rutenettet"
                      className="flex items-center gap-2 text-slate-200 hover:text-white whitespace-nowrap"
                    >
                      <span
                        className={`w-4 h-4 rounded flex items-center justify-center border transition-colors ${
                          snapToGrid ? 'bg-sky-300 border-sky-300 text-slate-950' : 'bg-[#0b1523] border-[#334e73]'
                        }`}
                      >
                        {snapToGrid && <Icon name="check" className="w-3 h-3" />}
                      </span>
                      <span>Fest til rutenett</span>
                    </button>

                    <button
                      onClick={() => setShowYourTools((v) => !v)}
                      title="Vis eller skjul verktøysilhuetter på holderne"
                      className="hidden sm:flex items-center gap-2 text-slate-200 hover:text-white whitespace-nowrap"
                    >
                      <span
                        className={`w-4 h-4 rounded flex items-center justify-center border transition-colors ${
                          showYourTools ? 'bg-sky-300 border-sky-300 text-slate-950' : 'bg-[#0b1523] border-[#334e73]'
                        }`}
                      >
                        {showYourTools && <Icon name="check" className="w-3 h-3" />}
                      </span>
                      <span>Dine verktøy</span>
                    </button>

                    <button
                      onClick={() => setShowLiftOut((v) => !v)}
                      title="Vis nødvendig løfteklaring over hver holder"
                      className="hidden md:flex items-center gap-2 text-slate-200 hover:text-white whitespace-nowrap"
                    >
                      <span
                        className={`w-4 h-4 rounded flex items-center justify-center border transition-colors ${
                          showLiftOut ? 'bg-sky-300 border-sky-300 text-slate-950' : 'bg-[#0b1523] border-[#334e73]'
                        }`}
                      >
                        {showLiftOut && <Icon name="check" className="w-3 h-3" />}
                      </span>
                      <span>Løfteklaring</span>
                    </button>
                  </div>
                </div>

                {/* VISNINGSOMRÅDE: 2D-PLANLEGGER ELLER 3D-VISNING */}
                <div className="flex-1 relative min-h-0 overflow-hidden">
                  {viewMode === '3d' ? (
                    <ThreeDInspectionView board={board} items={items} selectedId={selectedId} />
                  ) : (
                    <div
                      ref={viewportRef}
                      onPointerDown={handleViewportPointerDown}
                      onWheel={handleWheel}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={handleCanvasDrop}
                      className="w-full h-full relative overflow-hidden cursor-grab active:cursor-grabbing"
                      style={{
                        backgroundImage: 'radial-gradient(rgba(148,163,184,0.08) 1px, transparent 1px)',
                        backgroundSize: '22px 22px',
                      }}
                    >
                      <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{ overflow: 'visible' }}>
                        <defs>
                          <linearGradient id="chromeGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stopColor="#94a3b8" />
                            <stop offset="45%" stopColor="#e2e8f0" />
                            <stop offset="100%" stopColor="#94a3b8" />
                          </linearGradient>
                          <pattern id="pegHolesPattern" width={board.pitch} height={board.pitch} patternUnits="userSpaceOnUse">
                            <circle cx={board.pitch / 2} cy={board.pitch / 2} r={board.holeDiameter / 2} fill={boardColorObj.hole} stroke="rgba(255,255,255,0.06)" strokeWidth="0.4" />
                          </pattern>
                          <pattern id="liftOutHatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
                            <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(125,211,252,0.28)" strokeWidth="2" />
                          </pattern>
                        </defs>

                        <g transform={`translate(${pan.x}, ${pan.y}) scale(${zoom})`} className="pointer-events-auto">
                          <rect x={4} y={6} width={boardWidthMm} height={boardHeightMm} rx={6} fill="rgba(3, 7, 15, 0.55)" />
                          <rect data-board-bg="true" x={0} y={0} width={boardWidthMm} height={boardHeightMm} rx={6} fill={boardColorObj.fill} stroke={boardColorObj.rim} strokeWidth={1.6} />
                          <rect data-board-bg="true" x={0} y={0} width={boardWidthMm} height={boardHeightMm} rx={6} fill="url(#pegHolesPattern)" />

                          <g className="pointer-events-none">
                            <line x1={-16} y1={0} x2={-16} y2={boardHeightMm} stroke="#3b5a80" strokeWidth={1.1} />
                            <line x1={-21} y1={0} x2={-11} y2={0} stroke="#3b5a80" strokeWidth={1.1} />
                            <line x1={-21} y1={boardHeightMm} x2={-11} y2={boardHeightMm} stroke="#3b5a80" strokeWidth={1.1} />
                            <text x={-24} y={boardHeightMm / 2} textAnchor="middle" fill="#7dd3fc" fontSize="11" fontFamily="JetBrains Mono, monospace" transform={`rotate(-90, -24, ${boardHeightMm / 2})`}>
                              {boardHeightMm.toFixed(1)} mm
                            </text>
                          </g>

                          <g className="pointer-events-none">
                            <line x1={0} y1={-16} x2={boardWidthMm} y2={-16} stroke="#3b5a80" strokeWidth={1.1} />
                            <line x1={0} y1={-21} x2={0} y2={-11} stroke="#3b5a80" strokeWidth={1.1} />
                            <line x1={boardWidthMm} y1={-21} x2={boardWidthMm} y2={-11} stroke="#3b5a80" strokeWidth={1.1} />
                            <text x={boardWidthMm / 2} y={-22} textAnchor="middle" fill="#7dd3fc" fontSize="11" fontFamily="JetBrains Mono, monospace">
                              {boardWidthMm.toFixed(1)} mm
                            </text>
                          </g>

                          {items.map((item) => {
                            const isSelected = item.id === selectedId;
                            const liftMm = item.liftOutMm || mount.clearanceMm || 38;
                            return (
                              <g
                                key={item.id}
                                transform={`translate(${item.xMm}, ${item.yMm}) rotate(${item.rotation}, ${item.widthMm / 2}, ${item.heightMm / 2})`}
                                onPointerDown={(e) => handleItemPointerDown(e, item)}
                                className="cursor-move"
                              >
                                {showLiftOut && (
                                  <rect x={0} y={-liftMm} width={item.widthMm} height={liftMm} rx={3} fill="url(#liftOutHatch)" stroke="rgba(125,211,252,0.5)" strokeWidth={0.9} strokeDasharray="4 3" />
                                )}

                                <ToolIllustrationSVG item={item} showTool={showYourTools} />

                                <rect
                                  x={-2}
                                  y={-2}
                                  width={item.widthMm + 4}
                                  height={item.heightMm + 4}
                                  rx={4}
                                  fill="transparent"
                                  stroke={isSelected ? '#93c5fd' : 'rgba(148,163,184,0.22)'}
                                  strokeWidth={isSelected ? 2 / Math.max(0.5, zoom) : 0.8}
                                />

                                {!isSelected && (
                                  <g transform={`translate(${item.widthMm / 2}, -10)`}>
                                    <rect x={-Math.max(40, item.name.length * 3.5)} y={-12} width={Math.max(80, item.name.length * 7.0)} height={16} rx={4} fill="#0d1829" stroke="#2d4a70" strokeWidth={0.9} />
                                    <text x={0} y={-1.5} textAnchor="middle" fill="#e2e8f0" fontSize="8.5" fontWeight="500">
                                      {item.name}
                                    </text>
                                  </g>
                                )}
                              </g>
                            );
                          })}
                        </g>
                      </svg>

                      <div className="no-print absolute bottom-3 left-4 pointer-events-none text-xs text-slate-400">
                        Velg et verktøy for å redigere · dra for å flytte · dra på tom tavle for å panorere · rull for å zoome
                      </div>

                      <div className="no-print absolute bottom-3 right-4 flex items-center gap-1.5 bg-[#0f1c2e]/95 border border-[#243b5c] rounded-lg p-1">
                        <button
                          onClick={zoomToItem}
                          disabled={!selectedItem}
                          title="Zoom inn på valgt verktøy"
                          className="px-2.5 py-1.5 rounded text-xs font-medium text-slate-200 hover:bg-[#192e4a] disabled:opacity-40 whitespace-nowrap"
                        >
                          Zoom til valgt
                        </button>
                        <button
                          onClick={() => setZoom((z) => Math.max(0.25, Number((z * 0.85).toFixed(2))))}
                          aria-label="Zoom ut"
                          title="Zoom ut"
                          className="w-7 h-7 rounded flex items-center justify-center text-slate-200 hover:bg-[#192e4a]"
                        >
                          <Icon name="minus" className="w-3.5 h-3.5" />
                        </button>
                        <button
                          onClick={fitBoard}
                          title="Tilpass hele tavlen til skjermen"
                          className="px-2.5 py-1.5 rounded text-xs font-medium text-slate-200 hover:bg-[#192e4a] whitespace-nowrap tabular-nums"
                        >
                          Tilpass tavle ({Math.round(zoom * 100)}%)
                        </button>
                        <button
                          onClick={() => setZoom((z) => Math.min(2.8, Number((z * 1.18).toFixed(2))))}
                          aria-label="Zoom inn"
                          title="Zoom inn"
                          className="w-7 h-7 rounded flex items-center justify-center text-slate-200 hover:bg-[#192e4a]"
                        >
                          <Icon name="plus" className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* BUNNLINJE FOR VALGT ELEMENT */}
                <div className="no-print h-14 shrink-0 px-5 border-t border-[#1b2e47] bg-[#0d192b] flex items-center justify-between gap-4">
                  {selectedItem ? (
                    <>
                      <div className="flex items-center gap-4 min-w-0">
                        <div className="min-w-0">
                          <div className="text-sm font-semibold text-slate-100 truncate">{selectedItem.name}</div>
                          <div className="text-xs text-slate-400 font-mono tabular-nums truncate">
                            {selectedItem.widthMm} × {selectedItem.heightMm} mm · Hull ({Math.round(selectedItem.xMm / board.pitch)}, {Math.round(selectedItem.yMm / board.pitch)})
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 shrink-0">
                        <button
                          onClick={() => setViewMode(viewMode === '3d' ? 'planner' : '3d')}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-sky-400/60 text-xs font-medium text-slate-200 whitespace-nowrap"
                        >
                          <Icon name="cube" className="w-3.5 h-3.5" />
                          <span>{viewMode === '3d' ? 'Tilbake til 2D' : 'Se holder'}</span>
                        </button>
                        <button
                          onClick={() => setActiveRail('edit')}
                          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-sky-400/60 text-xs font-medium text-slate-200 whitespace-nowrap"
                        >
                          <Icon name="edit" className="w-3.5 h-3.5" />
                          <span>Rediger</span>
                        </button>
                        <button
                          onClick={() => removeItem(selectedItem.id)}
                          aria-label="Slett valgt verktøy"
                          title="Slett valgt verktøy (Delete)"
                          className="flex items-center justify-center p-1.5 rounded-lg bg-[#132338] border border-[#243b5c] hover:border-rose-400/70 text-slate-300 hover:text-rose-200"
                        >
                          <Icon name="trash" className="w-4 h-4" />
                        </button>
                        <span className="hidden lg:inline-flex items-center gap-1.5 ml-2 text-xs text-slate-400 tabular-nums whitespace-nowrap">
                          <Icon name="check" className="w-3.5 h-3.5 text-sky-300" />
                          {totalParts} {totalParts === 1 ? 'del klar' : 'deler klare'}
                        </span>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="text-xs text-slate-400">
                        Klikk på et verktøykort til venstre for å legge det til, eller velg et verktøy på tavlen for å redigere.
                      </div>
                      <div className="flex items-center gap-1.5 text-xs text-slate-400 tabular-nums whitespace-nowrap">
                        <Icon name="check" className="w-3.5 h-3.5 text-sky-300" />
                        <span>{totalParts} {totalParts === 1 ? 'del klar' : 'deler klare'}</span>
                      </div>
                    </>
                  )}
                </div>
              </main>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
